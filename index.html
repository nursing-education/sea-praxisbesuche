<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEA Praxisbesuche</title>
<meta name="description" content="Planung von Praxisbesuchen in der Pflegeausbildung: Azubis, Einsätze, Touren und Bezugslehrende.">
<!-- Interne Anwendung hinter Microsoft-Anmeldung - sie gehoert in keinen
     Suchindex. Die Rechtsseiten bleiben davon unberuehrt erreichbar. -->
<meta name="robots" content="noindex, nofollow">
<style>
  /* SEA-Token als Basis – in Claude Design überschreibbar */
  :root{
    --bg:#F4F1EB; --flaeche:#FFFFFF; --sekundaer:#EDE9DF;
    --text:#1A1A1A; --text-leise:#4A4845; --rahmen:#DDD8CB;
    --navy:#104E64; --orange:#F05100; --gold:#FCBD20;
    --forest:#3E6B47; --danger:#C73E47;
    --radius:8px; --sp:12px;
    --font:system-ui, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);font-size:15px;line-height:1.45}
  button{font:inherit;cursor:pointer;border:1px solid var(--rahmen);background:var(--flaeche);color:var(--text);
    padding:7px 12px;border-radius:var(--radius)}
  button:hover{border-color:var(--navy)}
  button.primaer{background:var(--navy);color:#fff;border-color:var(--navy)}
  button.aktion{background:var(--orange);color:#fff;border-color:var(--orange)}
  button.gefahr{color:var(--danger);border-color:var(--danger)}
  input,select{font:inherit;padding:6px 8px;border:1px solid var(--rahmen);border-radius:6px;background:var(--flaeche);color:var(--text)}
  label{font-size:13px;color:var(--text-leise)}
  a{color:var(--navy)}

  header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .stand{font-size:12px;opacity:.8;margin-left:auto}
  header .ver{font-size:11px;opacity:.7;font-weight:400;padding:1px 7px;border:1px solid rgba(255,255,255,.35);border-radius:999px}

  nav{display:flex;gap:4px;padding:8px 18px;background:var(--sekundaer);border-bottom:1px solid var(--rahmen)}
  nav button{position:relative;background:transparent;border:none;padding:8px 14px;border-radius:6px;color:var(--text-leise)}
  nav button.aktiv{background:var(--flaeche);color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  nav button.hat-hinweis::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;
    border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--sekundaer)}

  main{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;max-width:1280px;margin:0 auto;align-items:start}
  .spalte{background:var(--flaeche);border:1px solid var(--rahmen);border-radius:var(--radius);padding:14px}
  .spalte h2{font-size:14px;margin:0 0 10px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
  .leer{color:var(--text-leise);font-size:14px;padding:8px 0}


  .zeile{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--rahmen);border-radius:6px;margin-bottom:6px;background:var(--flaeche)}
  .zeile:hover{border-color:var(--navy)}
  .zeile .haupt{font-weight:600}
  .zeile .meta{font-size:12px;color:var(--text-leise)}
  .zeile .rechts{margin-left:auto;display:flex;gap:6px;align-items:center}
  .pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--sekundaer);color:var(--text-leise)}
  .pill.Akut{background:#dde9ee;color:var(--navy)} .pill.LZP{background:#e3ede4;color:var(--forest)}
  .pill.Amb{background:#fdeede;color:#9a5b00} .pill.Päd{background:#fbe8c2;color:#7a5a00}
  .pill.Psych{background:#efe2ee;color:#6a3a66} .pill.WE{background:#ececec;color:#555}
  .pill.OE,.pill.VE{background:var(--navy);color:#fff}
  .pill.stamm{background:var(--gold);color:#5a4500;font-weight:600}
  .stamm-row td{background:#fffaf0}
  .pill.fehlt{background:#fbe1e3;color:var(--danger)}

  /* Einsatztyp-Dropdown im Azubi-Detail: farbiger linker Rand nach Bereich */
  select.typsel{font-weight:600;border-left-width:4px}
  select.typsel.Akut,select.typsel.OE,select.typsel.VE{border-left-color:var(--navy)}
  select.typsel.LZP{border-left-color:var(--forest)}
  select.typsel.Amb{border-left-color:#9a5b00}
  select.typsel.Päd{border-left-color:#7a5a00}
  select.typsel.Psych{border-left-color:#6a3a66}
  select.typsel.WE{border-left-color:#555}

  /* Besuch-Status-Badges (Lebenslauf) – SEA-Farben */
  .bstatus{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;text-transform:capitalize;white-space:nowrap}
  .b-offen{background:var(--sekundaer);color:var(--text-leise)}
  .b-geplant{background:#D9E5EA;color:var(--navy)}
  .b-vorläufig{background:#f6e8d2;color:#8a5b15}
  .b-durchgeführt{background:#e3ede4;color:var(--forest)}
  .b-nachzuholen{background:#fbe1e3;color:var(--danger)}
  .b-uebernommen{background:#eef4ef;color:var(--forest);font-style:italic}
  button.winzig{padding:1px 7px;font-size:13px;line-height:1.3}

  /* Einsatz-Tabelle: gleiche Typen verschmelzen zu einem Block (keine Trennung),
     großer Abstand NUR beim Typwechsel – als echte Leerzeile (zuverlässig sichtbar) */
  .einsatztab{border-collapse:separate;border-spacing:0}
  .einsatztab td{border-bottom:none;vertical-align:middle;background-clip:padding-box}
  .einsatztab tbody tr:first-child td{border-top:8px solid transparent}             /* Luft unter dem Kopf */
  .einsatztab tr.typ-luecke td{height:18px;padding:0;border:0;background:transparent;box-shadow:none;font-size:0;line-height:0}
  .einsatztab tr.typ-start td:first-child{border-top-left-radius:7px}               /* Block oben gerundet */
  .einsatztab tr.typ-start td:last-child{border-top-right-radius:7px}
  .einsatztab tr.typ-end td:first-child{border-bottom-left-radius:7px}              /* Block unten gerundet */
  .einsatztab tr.typ-end td:last-child{border-bottom-right-radius:7px}
  .einsatztab tr.erledigt td{opacity:.5}                                            /* erledigter Einsatz ausgegraut */
  .einsatztab tr.row-Akut td{background:#d6e6ee}
  .einsatztab tr.row-OE td,.einsatztab tr.row-VE td{background:#9cc6d4}             /* Stamm-Rahmen: satter, klar von Akut getrennt */
  .einsatztab tr.row-LZP td{background:#dceae0}
  .einsatztab tr.row-Amb td{background:#fbe2cf}
  .einsatztab tr.row-Päd td{background:#f6e4ad}
  .einsatztab tr.row-Psych td{background:#ecdcec}
  .einsatztab tr.row-WE td{background:#e8e8e8}
  /* Status-Auswahl im Besuch-Formular */
  .seg-reihe{display:flex;gap:6px;flex-wrap:wrap}
  .seg{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1px solid var(--rahmen);
    border-radius:999px;cursor:pointer;font-size:13px;text-transform:capitalize}
  .seg input{margin:0}
  .seg:has(input:checked){box-shadow:0 0 0 2px currentColor inset;font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rahmen);vertical-align:middle}
  /* Prüfschritt: feste Spaltenbreiten -> Dropdowns bleiben in der Box (kein Überlauf rechts) */
  .pruef-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .prueftab{table-layout:fixed}
  .prueftab td,.prueftab th{overflow:hidden}
  .prueftab td:nth-child(2){word-break:break-word}
  .prueftab select{width:100%;max-width:100%;box-sizing:border-box}
  .pill.warn{background:#FDE7C8;color:#8a4b00}
  th{color:var(--text-leise);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
    padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2100}
  .toast.zeig{opacity:1}
  .toast.fehler{background:var(--danger)}
  /* v0.40: Toast mit Aktion. Die Grundform hat pointer-events:none (sie soll
     nie im Weg sein) -- die Bauform mit Knopf muss anklickbar sein. */
  .toast.mit-knopf{pointer-events:auto;display:flex;align-items:center;gap:14px}
  .toast-akt{background:none;border:1px solid rgba(255,255,255,.55);color:#fff;
    border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  .toast-akt:hover{background:rgba(255,255,255,.16)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:2000}
  .modal-bg.offen{display:flex}
  .modal{background:var(--flaeche);border-radius:var(--radius);padding:20px;width:100%;max-width:760px}
  .modal h3{margin:0 0 12px;color:var(--navy)}
  .feld{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
  .feld-reihe{display:flex;gap:10px;flex-wrap:wrap}
  .feld-reihe .feld{flex:1;min-width:140px}
  .modal-aktionen{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .hinweis{background:var(--sekundaer);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px;font-size:13px;margin-bottom:12px}
  .neu-mark{background:#fff7e6}
  .unsicher-mark{background:#FDEEDB}
  .hinweis.warn{border-left-color:#C8521E;background:#FDEEDB}
  .pill.vorschlag{background:#F6D9C2;color:#8a3b00;font-weight:600}
  /* v0.41: dritter Zustand neben aktiv und archiviert. Farbwerte aus dem
     vorhandenen Bestand (.unsicher-mark / .hinweis.warn), keine neue Farbe. */
  .pill.abwesend{background:#FDEEDB;color:#C8521E}
  /* v0.42: Rechtliches. Der Footer steht unter JEDER Ansicht -- Impressum und
     Datenschutzerklaerung muessen von jeder Stelle aus erreichbar sein (§ 5 DDG:
     "leicht erkennbar, unmittelbar erreichbar, staendig verfuegbar"). Deshalb
     ausserhalb von #inhalt, nicht in einer Ansicht. */
  footer.rechtliches{margin:32px 0 0;padding:14px 18px;border-top:1px solid var(--rahmen);
    background:var(--sekundaer);display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;
    font-size:13px;color:var(--text-leise)}
  footer.rechtliches a{color:var(--navy)}
  footer.rechtliches a:hover{color:var(--orange)}
  .werkzeug{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  /* v0.34: Azubi-Zuordnungs-Board (Dashboard, Admin) */
  .zb-board{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .zb-spalte{flex:1 1 240px;min-width:210px;background:var(--sekundaer);border-radius:var(--radius);padding:10px}
  .zb-kopf{font-size:13px;margin:0 0 8px;color:var(--text-leise);font-weight:600}
  .zb-azubi,.zb-lehrer{background:var(--flaeche);border:1px solid var(--rahmen);border-radius:6px;padding:8px 10px;margin-bottom:6px;display:flex;flex-direction:column;gap:2px}
  .zb-azubi{cursor:grab}
  .zb-azubi.gewaehlt{outline:2px solid var(--navy);border-color:var(--navy)}
  /* v0.40.3: Kursfarbe als Flaeche statt als Kante. Die Kante war zu duenn, um zu
     gruppieren, aber dick genug, um zu stoeren -- und neben dem fetten Namen kippte
     die Hierarchie. Jetzt traegt die ganze Kachel einen hellen Kurston und der Name
     sitzt in einem kraeftigeren Balken darin. --kf ist der Farbwinkel aus
     Dashboard.kursFarben; Saettigung und Helligkeit sind fest, dadurch wirken alle
     Kurse wie eine Familie und der Text bleibt bei jedem Ton gleich gut lesbar. */
  .zb-azubi .zb-name{font-weight:600;font-size:14px;line-height:1.3}
  .zb-azubi.hat-kf{background:hsl(var(--kf), 42%, 96%);border-color:hsl(var(--kf), 30%, 82%)}
  .zb-azubi.hat-kf .zb-name{background:hsl(var(--kf), 38%, 87%);color:hsl(var(--kf), 45%, 22%);
    margin:-8px -10px 4px;padding:5px 10px;border-radius:5px 5px 0 0}
  .zb-lehrer{cursor:pointer}
  .zb-lehrer.zb-ueber{outline:2px dashed var(--forest);background:#EEF4EF}
  /* v0.37: Zuordnungs-Leiste (Chips oben) + Lehrkraft-Zeile als Zuordnungs-Ziel */
  .zo-leiste{background:var(--sekundaer);border-radius:var(--radius);padding:10px;margin-bottom:12px}
  .zo-kopf{font-size:13px;color:var(--text-leise);font-weight:600;margin-bottom:6px}
  .zo-kopf .meta{font-weight:400}
  .zo-chips{display:flex;flex-wrap:wrap;gap:6px}
  .zo-chips .zb-azubi{margin-bottom:0;min-width:150px}
  .zb-haus{font-style:italic}
  .zb-vorher{color:var(--text-leise);font-style:italic}
  /* v0.41.1: Park-Marker -- hebt sich vom blassen "vorher" ab, weil er das
     Gegenteil sagt: nicht frei, sondern reserviert. Farbwerte wie .pill.abwesend,
     damit Zeile und Kachel dieselbe Abwesenheit gleich einfaerben. */
  .zb-wartet{background:#FDEEDB;color:#C8521E;font-weight:600;border-radius:4px;padding:0 4px}
  /* v0.40: zweispaltiger Arbeitsbereich. Vertikaler Platz ist bei 40 Zeilen das
     Nadeloehr, horizontaler ist frei -- deshalb steht die Zuordnungs-Spalte
     links und nicht als Leiste oben. Sie bleibt beim Scrollen stehen und
     scrollt innen, weil 30 Kacheln hoeher sind als jeder Bildschirm. */
  .zo-zweispaltig{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
  .zo-spalte{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  .zo-spalte .zo-chips{flex-direction:column}
  .zo-spalte .zo-chips .zb-azubi{min-width:0}
  .zo-werkzeug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .zo-werkzeug input[type=search]{flex:1 1 100%}
  .zo-rechts{min-width:0}
  /* Schmales Fenster: zurueck auf die Form vor v0.40 -- Leiste quer oben,
     Tabelle darunter. Gleiches Markup, nur andere Regeln. */
  @media (max-width:1199px){
    .zo-zweispaltig{display:block}
    .zo-spalte{position:static;max-height:none;overflow:visible;margin-bottom:12px}
    .zo-spalte .zo-chips{flex-direction:row}
    .zo-spalte .zo-chips .zb-azubi{min-width:150px}
  }
  /* v0.40: aufklappbare Azubis je Lehrkraft. Eigenes Chevron statt Zeilenklick --
     der Zeilenklick ist seit v0.37 das Zuordnungs-Ziel. */
  .lk-chevron{border:none;background:none;padding:2px 6px;cursor:pointer;color:var(--text-leise)}
  .lk-chevron .chevron{display:inline-block;transition:transform .15s}
  .lk-chevron.offen .chevron{transform:rotate(90deg)}
  .lk-auf{width:1%;white-space:nowrap}
  .lk-azubis > td{background:var(--sekundaer);padding:8px 10px}
  .lk-kacheln{display:flex;flex-wrap:wrap;gap:6px}
  .lk-kacheln .zb-azubi{margin-bottom:0;min-width:150px}
  .lk-zeile.zb-ueber > td,
  .lk-azubis.zb-ueber > td{background:#EEF4EF;box-shadow:inset 0 0 0 1px var(--forest)}
  /* v0.40: Volle Lehrkraefte werden gedimmt, solange zugeordnet wird -- per
     Klick (zuordnen-aktiv, seit v0.37) ODER waehrend eines Ziehvorgangs
     (zieht). Beim Ziehen wird nicht neu gezeichnet, deshalb haengt die Klasse
     immer an der Zeile und das CSS entscheidet, wann sie wirkt. */
  .zuordnen-aktiv .lk-voll,
  #lehrerTabelle.zieht .lk-voll{opacity:.5}
  .zo-spalte.zb-ueber{outline:2px dashed var(--forest);background:#EEF4EF}
  /* v0.40.1: Ablageflaeche. Die Spalte war zwar Drop-Ziel, hatte aber im leeren
     Zustand gar keine Flaeche -- man musste die Infozeile treffen. */
  .zo-ablage{display:none;margin-top:10px;padding:16px 10px;text-align:center;
    border:2px dashed var(--rahmen);border-radius:var(--radius);
    color:var(--text-leise);font-size:13px}
  .zieht-zeile .zo-ablage{display:block}
  .zo-spalte.zb-ueber .zo-ablage{border-color:var(--forest);background:#EEF4EF}
  .zuordnen-aktiv .lk-zeile{cursor:copy}
  .lk-aktion{white-space:nowrap}
  .akt-menue{position:relative;display:inline-block}
  .akt-knopf{padding:2px 8px;line-height:1.1;font-size:16px}
  .akt-liste{position:absolute;right:0;top:100%;z-index:30;min-width:150px;
    background:#fff;border:1px solid var(--rahmen);border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.13);padding:4px;text-align:left}
  .akt-liste button{display:block;width:100%;text-align:left;border:0;background:none;
    padding:7px 10px;border-radius:6px;font-size:13px}
  .akt-liste button:hover{background:var(--sekundaer)}
  .akt-liste button.gefahr{color:var(--danger);border-top:1px solid var(--rahmen);
    border-radius:0 0 6px 6px;margin-top:2px}
  .kpi.klickbar{cursor:pointer}
  .kpi.klickbar:hover{border-color:var(--navy)}
  .kpi-gold .kpi-zahl{color:var(--gold)}
  .werkzeug input[type=search]{flex:1;min-width:160px}

  /* Einstellungen: flache Abschnitte auf einer Seite (v0.29) */
  .einst-block{border:1px solid var(--rahmen);border-radius:var(--radius);margin-bottom:12px;background:var(--flaeche);padding:12px 16px 16px}
  .spalte .einst-block h2{font-size:13px;margin:16px 0 8px;color:var(--navy);text-transform:none;letter-spacing:0;font-weight:600;display:flex;align-items:center;gap:6px}
  .spalte .einst-block h2:first-child{margin-top:4px}
  .einst-info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--sekundaer);color:var(--text-leise);font-size:10px;font-weight:700;cursor:help;user-select:none}
  /* Dashboard: Rollen-Badge (Admin = Verwaltung, sonst Nur-Lese) */
  .rollen-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sekundaer);color:var(--text-leise);vertical-align:middle;margin-left:8px}
  .rollen-badge.admin{background:var(--navy);color:#fff}
  /* Dashboard Etappe 1: Besuchs-Kennzahlen-Kacheln (read-only, Erklärung per title-Hover) */
  .kpi-reihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:6px}
  .kpi{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--rahmen);border-radius:var(--radius);background:var(--flaeche);cursor:help}
  .kpi-zahl{font-size:26px;font-weight:700;line-height:1;color:var(--text)}
  .kpi-label{font-size:12px;color:var(--text-leise)}
  .kpi-forest .kpi-zahl{color:var(--forest)}
  .kpi-navy .kpi-zahl{color:var(--navy)}
  .kpi-danger .kpi-zahl{color:var(--danger)}
  /* Einrichtungen: nach Bereich gruppiert, aufklappbar */
  .einr-gruppe{border:1px solid var(--rahmen);border-radius:var(--radius);margin-bottom:8px;overflow:visible;background:var(--flaeche)}
  .gruppe-kopf{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;border-radius:var(--radius);
    background:var(--sekundaer);padding:10px 12px}
  .gruppe-kopf.offen{border-radius:var(--radius) var(--radius) 0 0}
  .gruppe-kopf:hover{border-color:transparent;background:#e6e1d6}
  .gruppe-kopf .chevron{width:14px;color:var(--text-leise);transition:transform .15s}
  .gruppe-kopf.offen .chevron{transform:rotate(90deg)}
  .gruppe-kopf .anzahl{margin-left:auto;font-size:12px;color:var(--text-leise);font-weight:600}
  .gruppe-body{padding:2px 4px 6px}
  .gruppe-body table{font-size:14px}
  .gruppe-body tbody tr:last-child td{border-bottom:none}
  .treffer{background:#fef7d6}
  mark{background:var(--gold);color:inherit;padding:0 1px;border-radius:2px}

  /* Anstehende Besuche: 4 Status-Gruppen, Block-Karten im Raster (Option A) */
  .anstehend-sektion{margin-bottom:18px}
  .anstehend-kopf{font-size:15px;font-weight:700;color:var(--text);margin:0 0 10px;display:flex;align-items:center;gap:9px}
  .anstehend-kopf .ak-ico{width:13px;height:13px;border-radius:3px;flex:none;display:inline-block;background:var(--text-leise)}
  .anstehend-kopf .anzahl{font-size:13px;font-weight:700;color:var(--text-leise)}
  .akopf-ueberfaellig .ak-ico{background:var(--danger)} .akopf-ueberfaellig .anzahl{color:var(--danger)}
  .akopf-diesewoche  .ak-ico{background:#1D9E75}        .akopf-diesewoche  .anzahl{color:#1D9E75}
  .akopf-geplant     .ak-ico{background:var(--navy)}    .akopf-geplant     .anzahl{color:var(--navy)}
  .akopf-abstimmen   .ak-ico{background:#BA7517}        .akopf-abstimmen   .anzahl{color:#BA7517}

  .av-geplant{border-left-color:var(--navy)}          .av-geplant     .av-kreis{background:#d9e5ea;color:var(--navy)}    .av-geplant     .av-kdat{color:var(--navy)}

  .sammel-karte:hover{border-color:var(--navy)}

  .sammel-kopf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .stufe-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}

  /* v0.17: Layout Option C – Karte fix links (~60 %), Panel rechts scrollbar (~38 %) */
  .tour-layout{display:flex;gap:14px;align-items:stretch;height:calc(100vh - 175px);min-height:480px}

  .tour-rechts{flex:0 0 38%;min-width:220px;overflow-y:auto;min-height:0;padding-right:4px}

  @media(max-width:720px){

  /* v0.17: Tour-Builder */
  .tb-stops{border:1px solid var(--rahmen);border-radius:var(--radius);max-height:230px;overflow-y:auto;background:var(--flaeche)}
  .tb-stop{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-bottom:1px solid var(--rahmen);font-size:13px;cursor:pointer}

  .tb-tabelle{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}

  .tb-tabelle .zahl{text-align:right;white-space:nowrap}
  /* v0.17: Gespeicherte Touren */
  .tour-eintrag{border:1px solid var(--rahmen);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;background:var(--flaeche);cursor:pointer}
  .tour-eintrag:hover{border-color:var(--navy)}
  .tour-eintrag.aktiv{box-shadow:0 0 0 2px var(--navy);border-color:var(--navy)}

  .badge-dfa{font-size:11px;background:#e5e3dd;color:#5b5a55;border-radius:999px;padding:2px 7px;white-space:nowrap}
  .tour-detail{margin-top:6px;font-size:13px}
  .tour-undo{display:flex;align-items:center;gap:10px;background:#fbf2e2;border:1px solid #e8d6b0;border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;font-size:13px}
  /* v0.17: Routen-Marker (nummerierte Stops + Start) */
  .map-stop-nr{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;border:2px solid #fff;

  /* Pin-Highlight: aktive Einrichtungen hervorheben, übrige abdimmen */

  /* ---- Kalender / Einsatz-Zeitleiste (Gantt) ---- */
  /* Umschalter Liste|Kalender + Zoom: segmentierte Knopfgruppe */
  .seg-knopf{display:inline-flex;border:1px solid var(--rahmen);border-radius:999px;overflow:hidden;background:var(--flaeche)}
  .seg-knopf button{border:none;border-radius:0;padding:5px 13px;background:transparent;color:var(--text-leise);font-size:13px}
  .seg-knopf button.an{background:var(--navy);color:#fff}

  .kal-leiste{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kal-leiste .kal-titel{font-weight:700;color:var(--navy);min-width:90px}
  .kal-pfeil{padding:4px 11px;font-size:15px;line-height:1}

  /* Scroll-Container: horizontal + vertikal; Zeitachse sticky oben, Namen sticky links */
  #kalScroll{overflow:auto;max-height:68vh;border:1px solid var(--rahmen);border-radius:var(--radius);background:var(--flaeche)}
  .kal-zeile{display:flex;align-items:stretch;border-bottom:1px solid var(--rahmen)}
  .kal-zeile:last-child{border-bottom:none}
  .kal-name{flex:0 0 168px;width:168px;position:sticky;left:0;z-index:2;background:var(--flaeche);
    border-right:1px solid var(--rahmen);padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .kal-name .knm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kal-name .kmeta{font-size:11px;color:var(--text-leise)}
  .kal-spur{position:relative;flex:0 0 auto;min-height:38px}

  /* Kopfzeile (Zeitachse) */
  .kal-kopf{position:sticky;top:0;z-index:3;background:var(--sekundaer);border-bottom:1px solid var(--rahmen)}
  .kal-kopf .kal-name{background:var(--sekundaer);z-index:4;font-size:12px;color:var(--text-leise);
    text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .kal-kopf .kal-spur{min-height:30px}
  .kal-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--rahmen)}
  .kal-tick span{position:absolute;top:6px;left:3px;font-size:10px;color:var(--text-leise);white-space:nowrap}
  .kal-tick.we{background:rgba(16,78,100,.045)}              /* Wochenende leicht getönt */

  /* Rasterlinien je Spur (dezent) + Wochenend-Tönung */
  .kal-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--rahmen);opacity:.5}
  .kal-grid.we{background:rgba(16,78,100,.04);border-left-color:transparent}

  /* Einsatz-Balken */
  .kal-bar{position:absolute;top:6px;height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.12);
    display:flex;align-items:center;padding:0 6px;font-size:11px;font-weight:600;color:var(--text);
    overflow:hidden;white-space:nowrap;cursor:pointer;box-sizing:border-box}
  .kal-bar:hover{filter:brightness(.95);box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .kal-bar.laeuft{box-shadow:0 0 0 2px var(--navy);border-color:var(--navy)}   /* laufender Einsatz hervorgehoben */
  .kal-bar.we-bar{opacity:.55}                                                  /* WE gedämpft */
  .kal-bar.bar-Akut{background:#d6e6ee}
  .kal-bar.bar-OE,.kal-bar.bar-VE{background:#9cc6d4}
  .kal-bar.bar-LZP{background:#dceae0}
  .kal-bar.bar-Amb{background:#fbe2cf}
  .kal-bar.bar-Päd{background:#f6e4ad}
  .kal-bar.bar-Psych{background:#ecdcec}
  .kal-bar.bar-WE{background:#e8e8e8}
  .kal-bar .bvisit{margin-left:4px;font-size:10px}      /* kleiner Status-Punkt (Pflichtbesuch) */

  /* Heute-Linie: durchgehend rot über alle Spuren */
  #kalHeute{position:absolute;top:0;width:2px;background:var(--danger);z-index:2;pointer-events:none}
  #kalHeute::before{content:"heute";position:absolute;top:2px;left:3px;font-size:9px;font-weight:700;
    color:#fff;background:var(--danger);padding:0 4px;border-radius:3px}

  /* Kurs-Kopf (aufklappbar) */
  .kal-kurs{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;border-radius:0;
    background:#e6e1d6;padding:7px 12px;position:sticky;left:0;font-weight:700;color:var(--navy);font-size:13px}
  .kal-kurs:hover{border-color:transparent;background:#ded8ca}
  .kal-kurs .chevron{width:12px;transition:transform .15s}
  .kal-kurs.zu .chevron{transform:rotate(-90deg)}
  .kal-kurs .kanz{margin-left:auto;font-weight:600;color:var(--text-leise);font-size:12px}
  .kal-legende{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-leise)}
  .kal-legende span{display:inline-flex;align-items:center;gap:5px}
  .kal-legende i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.12)}

  /* v0.26: Startseite + Auslastungs-Dashboard (SPEC_SEA-Dashboard) */
  nav button.nav-start{color:var(--navy);font-weight:600}
  .start-kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;max-width:640px;margin-top:14px}
  .kachel{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;text-align:left;
    border:1px solid var(--rahmen);border-radius:var(--radius);background:var(--flaeche);cursor:pointer}
  .kachel:hover{border-color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.08)}

  .ausl-balken{height:6px;border-radius:3px;background:var(--sekundaer);overflow:hidden;min-width:90px}

  /* ===== v0.27: Onboarding-Wizard (Etappe 1) ===========================
     Spotlight-Overlay + Sprechblase. Das SVG-Overlay ist rein visuell
     (pointer-events:none), damit Live-Schritte (z.B. Adresse eintippen) in
     der echten UI bedienbar bleiben; nur die Sprechblase fängt Klicks ab. */
  .ob-overlay{position:fixed;inset:0;z-index:2050;pointer-events:none}
  .ob-block{position:absolute;background:rgba(16,32,40,.55);pointer-events:none}
  .ob-rahmen{position:absolute;border:2px solid var(--orange);border-radius:10px;pointer-events:none}
  .ob-blase{position:fixed;z-index:2060;pointer-events:auto;max-width:340px;width:min(340px,88vw);
    background:var(--flaeche);color:var(--text);border:1px solid var(--rahmen);border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.28);padding:16px 18px}
  /* Zentrierung ueber die eigene translate-Eigenschaft, NICHT ueber transform:
     die Einblendung ob-fade endet auf "transform:none" und laeuft mit fill-mode
     "both" -- ein transform hier wuerde danach ueberschrieben und die Blase
     bliebe um ihre halbe Breite nach rechts versetzt stehen. Auf breiten
     Schirmen faellt das nicht auf, bei 390 px ragte sie aus dem Bild. */
  .ob-blase.mitte{position:fixed;left:50%;top:50%;translate:-50% -50%;max-width:440px;width:min(440px,92vw);text-align:center}
  .ob-blase h3{margin:0 0 8px;color:var(--navy);font-size:17px}
  .ob-blase p{margin:0 0 6px;font-size:14px;line-height:1.5}
  .ob-blase .ob-hinweis{font-size:12px;color:var(--text-leise);margin-top:8px}
  .ob-illu{display:flex;justify-content:center;margin:2px 0 12px}
  .ob-illu svg{width:132px;height:88px}
  .ob-fort{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
  .ob-fort i{width:8px;height:8px;border-radius:50%;background:var(--rahmen);transition:background .2s,transform .2s}
  .ob-fort i.an{background:var(--navy);transform:scale(1.25)}
  .ob-fort i.fertig{background:var(--forest)}
  .ob-aktionen{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
  .ob-aktionen .links{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ob-aktionen .rechts{display:flex;gap:8px;margin-left:auto;align-items:center}
  .ob-aktionen button{font-size:14px}
  .ob-skip{background:transparent;border:none;color:var(--text-leise);text-decoration:underline;padding:4px 2px}
  .ob-skip:hover{color:var(--navy)}

  /* Animationen (reines CSS, SEA-Farben, dezent) */
  @keyframes ob-fade{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes ob-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes ob-draw{to{stroke-dashoffset:0}}
  @keyframes ob-puls{0%,100%{opacity:.35}50%{opacity:1}}
  .ob-illu svg .anim-fade{animation:ob-fade .7s ease both}
  .ob-illu svg .anim-pop{opacity:0;animation:ob-pop .5s ease forwards}
  .ob-illu svg .anim-draw{stroke-dasharray:140;stroke-dashoffset:140;animation:ob-draw 1.1s ease forwards}
  .ob-illu svg .anim-puls{animation:ob-puls 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){
    .ob-illu svg *{animation:none !important;opacity:1 !important;stroke-dashoffset:0 !important}
    .ob-blase{animation:none !important}
  }

  /* ===== v0.43: Notbremse fuer schmale Schirme ==========================
     Gemessen am 04.08.2026 bei 390 px: die Seite blaehte sich auf 612 px auf,
     die zweite Spalte von main fiel auf 0 px, Kopfzeile und Reiterleiste
     ragten aus dem Bild. Hier wird nur das Ueberlaufen abgestellt -- nichts
     wird schoen, aber alles ist erreichbar. Zuschnitt: spec/smartphone.md. */
  @media (max-width:700px){
    /* 340px feste Spalte + Abstaende passen nicht in 390px -- die zweite
       Spalte fiel dadurch auf 0 px zusammen. Untereinander statt nebeneinander. */
    main{grid-template-columns:1fr;gap:12px;padding:12px}
    /* Ein Grid-Kind darf schmaler werden als sein Inhalt, sonst schiebt es
       die ganze Seite in die Breite. */
    .spalte{min-width:0}
    header{flex-wrap:wrap;gap:8px;padding:10px 12px}
    nav{flex-wrap:wrap;padding:8px 12px}
    /* Breite Tabellen scrollen in sich selbst, statt die Seite zu schieben.
       .prueftab liegt bereits in .pruef-scroll und bleibt unangetastet. */
    main table:not(.prueftab){display:block;overflow-x:auto}
  }

<script>
/* =========================================================================
   SEA Praxisbesuche
   Vanilla JS, deutsche PascalCase-Module. Alle Daten laufen über "Daten".
   ========================================================================= */

const APP_VERSION = "0.43.0";  // = umgesetzte Spec-Version (HTML wird mitversioniert)
const BEREICHE = ["Akut","LZP","Amb","Päd","Psych","WE"];
const TYPEN    = ["OE","PE Akut","PE LZP","PE Amb","PE Päd","PE Psych","VE","WE"];
const STATUS   = ["offen","vorläufig","geplant","durchgeführt","nachzuholen"];
/* Pflichtbereiche, die jeder PFK-Azubi erfüllen muss (WE ist optional) */
const PFLICHT_PFK = ["OE","PE Akut","PE LZP","PE Amb","PE Päd","PE Psych","VE"];
/* Ist ein Einsatz dieses Typs ein Pflichtbesuch?
   PFK: jeder Nicht-WE-Einsatz. PFA: genau die beiden Marker-Typen OE (früh) und VE (Abschluss). */
function istPflicht(ausbildung, typ){
  return ausbildung==="PFA" ? (typ==="OE"||typ==="VE") : (typ!=="WE");
}
/* Typ-Ableitung PFK (v0.15): Lauf-Erkennung mit Stunden-Deckel.
   OE = führender Lauf an der Stammeinrichtung (gedeckelt ~400h, Block voll ab 320h).
   VE = abschließender Lauf an der Stammeinrichtung (gedeckelt ~500h, Block voll ab 400h).
   Mitte = "PE "+Bereich bzw. "WE". Die Stammeinrichtung ergibt sich aus dem ersten Einsatz.
   Funktioniert bei geteilten Blöcken (mehrere CSV-Zeilen je Block) und bei Psych-Stamm:
   PE Psych liegt an der Stammeinrichtung, wird durch den Stunden-Deckel sauber vom VE-Block
   getrennt und erhält über den Bereich automatisch "PE Psych".
   Ohne Stunden (std=0): Fallback positional (1–2 Einträge vorn = OE, letzter Stamm-Einsatz = VE). */
function typAbleitenPFK(eintraege){
  const n=eintraege.length;
  const typ=new Array(n).fill(null);
  if(n===0) return typ;
  const stamm=eintraege[0].einrichtungName||null;
  const istStamm=e=> !!stamm && e.einrichtungName===stamm;
  const hatStd = eintraege.some(e=> (e.std||0)>0);
  let i=0, cumOE=0;
  while(i<n && istStamm(eintraege[i]) && cumOE<500){
    typ[i]="OE"; cumOE+=(eintraege[i].std||0); i++;
    if(hatStd && cumOE>=320) break;
    if(!hatStd && i>=2) break;
  }
  if(i===0){ typ[0]="OE"; i=1; }
  let j=n-1, cumVE=0;
  while(j>=i && istStamm(eintraege[j]) && cumVE<650){
    typ[j]="VE"; cumVE+=(eintraege[j].std||0); j--;
    if(hatStd && cumVE>=400) break;
    if(!hatStd) break;
  }
  if(j>=i && !typ.includes("VE") && n>1){
    for(let k=n-1;k>=i;k--){ if(istStamm(eintraege[k])){ typ[k]="VE"; j=k-1; break; } }
  }
  for(let k=i;k<=j;k++){
    if(typ[k]) continue;
    const b=eintraege[k].bereichVorschlag||"LZP";
    typ[k]= b==="WE" ? "WE" : "PE "+b;
  }
  for(let k=0;k<n;k++){ if(!typ[k]){ const b=eintraege[k].bereichVorschlag||"LZP"; typ[k]= b==="WE"?"WE":"PE "+b; } }
  return typ;
}
/* Pflichtbesuche markieren (v0.19): je Pflicht-Typ EIN empfohlener Besuch — am ERSTEN Teileinsatz
   dieses Typs (v0.19: geändert von „meiste Stunden" auf „erster", Christians Regel). Der Nutzer darf
   danach frei weitere Teileinsätze desselben Typs als Pflichtbesuch markieren (z.B. Probeexamen).
   WE und (bei PFA) Nicht-OE/VE nie Pflicht (Default).
   Ein Typ mit manuell festgelegtem Pflichtbesuch (pflichtManuell) wird komplett ausgenommen. */
function pflichtbesucheMarkieren(eintraege, ausbildung){
  const manuelleTypen=new Set();
  eintraege.forEach(e=>{ if(e.pflichtManuell!=null) manuelleTypen.add(e.typ); });
  eintraege.forEach(e=>{ if(e.pflichtManuell==null) e.pflichtbesuch=false; });
  const proTyp={};
  eintraege.forEach((e,idx)=>{
    if(manuelleTypen.has(e.typ)) return;
    if(!istPflicht(ausbildung,e.typ)) return;
    (proTyp[e.typ]=proTyp[e.typ]||[]).push(idx);
  });
  Object.keys(proTyp).forEach(t=>{
    const idxs=proTyp[t];               // Reihenfolge = Einsatzreihenfolge → idxs[0] ist der erste
    eintraege[idxs[0]].pflichtbesuch=true;
  });
}
/* Pflicht-Typen je Ausbildung. */
const PFK_PFLICHTTYPEN=["OE","PE Akut","PE LZP","PE Amb","PE Päd","PE Psych","VE"];
/* Vollständigkeitsprüfung (v0.15): Sind alle Pflicht-Typen abgedeckt?
   Fehlt ein PE-Typ und gibt es einen "flexiblen Spender" (Eintrag an einer Einrichtung, die den
   fehlenden Bereich kann, und dessen aktueller Typ über-abgedeckt ist, z.B. eine von zwei
   PE-Psych-Zeilen an Königshof), wird EIN Eintrag umgehängt und als `unsicher` markiert
   (Dozenten-Vorschlag). Lücken ohne Spender werden gemeldet, aber nichts erfunden.
   Liefert die Liste der weiterhin fehlenden Pflicht-Typen zurück. */
function verteilungPruefen(eintraege, ausbildung){
  const soll = ausbildung==="PFA" ? ["OE","VE"] : PFK_PFLICHTTYPEN;
  const vorhanden=()=> new Set(eintraege.map(e=>e.typVorschlag));
  soll.forEach(t=>{
    if(t==="OE"||t==="VE") return;
    if(vorhanden().has(t)) return;
    const bereich=t.replace(/^PE /,"");
    let best=-1, bestScore=-1;
    eintraege.forEach((e,i)=>{
      if(!(Einrichtungen.bereicheVon(e.einrichtungName)||[]).includes(bereich)) return;
      const akt=e.typVorschlag;
      if(akt==="OE"||akt==="VE") return;
      const anzahl=eintraege.filter(x=>x.typVorschlag===akt).length;
      if(anzahl<2) return;                       // nur über-abgedeckte Typen anzapfen
      let score=anzahl;
      const s=(e.einrichtungName||"").toLowerCase();
      if(bereich==="Akut" && /klinik|krankenhaus|hospital/.test(s) && !/psych/.test(s)) score+=5;
      if(score>bestScore){ bestScore=score; best=i; }
    });
    if(best>=0){ eintraege[best].typVorschlag=t; eintraege[best].unsicher=true; }
  });
  return soll.filter(t=> !vorhanden().has(t));
}

/* Wandelt den CSV-Kurswert (Easysoft-Langform, z.B. "PFK 041 N 2024 H") in einen
   VORSCHLAG fuer die in SharePoint gepflegte Kurzform um (z.B. "PFK N 041").
   Nur ein Vorschlag -- der Admin sieht und bestaetigt/korrigiert ihn im
   "Azubi anlegen"-Dialog (Eingang.uebernehmen/_azubiKeinTreffer), bevor er
   geschrieben wird. Basis: ein verifiziertes Beispiel-Paar (Christian, 18.07.2026);
   erkennt die Regel das Muster nicht, wird der Wert unveraendert zurueckgegeben. */
function kursVorschlagAusCsv(csvKurs){
  const s=String(csvKurs||"").trim();
  const m=s.match(/^([A-Za-zÄÖÜäöüß]+)\s+(\d{2,3})(?:\s+([A-Z]))?/);
  if(!m) return s;
  const typ=m[1], nr=m[2], ort=m[3];
  return ort ? (typ+" "+ort+" "+nr) : (typ+" "+nr);
}

/* ---------- DB: dünne IndexedDB-Hülle --------------------------------- */
const DB = {
  _db:null,
  async oeffnen(){
    if(this._db) return this._db;
    this._db = await new Promise((ok,err)=>{
      const a = indexedDB.open("sea-praxisbesuche",1);
      a.onupgradeneeded = ()=>{
        const d=a.result;
        if(!d.objectStoreNames.contains("app")) d.createObjectStore("app");
        if(!d.objectStoreNames.contains("sicherungen")) d.createObjectStore("sicherungen");
      };
      a.onsuccess=()=>ok(a.result);
      a.onerror =()=>err(a.error);
    });
    return this._db;
  },
  async _tx(store,modus,fn){
    const d=await this.oeffnen();
    return new Promise((ok,err)=>{
      const tx=d.transaction(store,modus); const s=tx.objectStore(store);
      const r=fn(s); tx.oncomplete=()=>ok(r&&r.result); tx.onerror=()=>err(tx.error);
    });
  },
  get(store,key){ return this._tx(store,"readonly",s=>s.get(key)); },
  set(store,key,val){ return this._tx(store,"readwrite",s=>s.put(val,key)); },
  del(store,key){ return this._tx(store,"readwrite",s=>s.delete(key)); },
  keys(store){ return this._tx(store,"readonly",s=>s.getAllKeys()); }
};

/* ---------- Merge: pro Azubi gewinnt der neuere Stand ----------------- */
const Merge = {
  azubiMerge(bestand, eingehend){
    const map=new Map(bestand.map(a=>[a.id,a]));
    for(const e of eingehend){
      const b=map.get(e.id);
      if(!b){ map.set(e.id,e); continue; }
      const neuer = new Date(e.aktualisiertAm||0) >= new Date(b.aktualisiertAm||0);
      // Besuchsstände des Bestands über Einsatz (von+typ) bewahren
      const bewahrt = neuer ? this._statusUebernehmen(e,b) : b;
      map.set(e.id, bewahrt);
    }
    return [...map.values()];
  },
  _statusUebernehmen(neu, alt){
    const altMap=new Map((alt.einsaetze||[]).map(x=>[x.von+"|"+x.typ,x]));
    (neu.einsaetze||[]).forEach(x=>{
      const a=altMap.get(x.von+"|"+x.typ);
      if(a){ x.besuchStatus=a.besuchStatus; x.besuchDatum=a.besuchDatum; x.besuchUhrzeit=a.besuchUhrzeit; }
    });
    return neu;
  },
  vollMerge(eingehend){
    const s=Daten.state;
    if(eingehend.einrichtungen) Einrichtungen.merge(eingehend.einrichtungen);
    if(eingehend.azubis) s.azubis=this.azubiMerge(s.azubis, eingehend.azubis);
    if(eingehend.azubiNamen) Object.assign(s.azubiNamen, eingehend.azubiNamen);
    if(eingehend.termine) s.termine=eingehend.termine.concat(s.termine.filter(t=>!eingehend.termine.find(e=>e.id===t.id)));
  }
};

/* ---------- Sicherung: Auto-Backup, letzte 5 -------------------------- */
const Sicherung = {
  async anlegen(){
    const key=new Date().toISOString();
    await DB.set("sicherungen",key, JSON.parse(JSON.stringify(Daten.state)));
    await this.aufraeumen();
    return key;
  },
  async aufraeumen(){
    const keys=(await DB.keys("sicherungen")).sort();
    while(keys.length>5){ await DB.del("sicherungen",keys.shift()); }
  },
  async liste(){ return (await DB.keys("sicherungen")).sort().reverse(); },
  async alleLoeschen(){ const keys=await DB.keys("sicherungen"); for(const k of keys) await DB.del("sicherungen",k); },
  async wiederherstellen(key){
    const s=await DB.get("sicherungen",key);
    if(!s){ Oberflaeche.toast("Sicherung nicht gefunden",true); return; }
    Daten.state=s; await Daten.speichern("Sicherung wiederhergestellt"); Oberflaeche.render();
  }
};

/* ---------- Einrichtungen: Liste + Bereich + CRUD --------------------- */
const Einrichtungen = {
  _norm(s){ return (s||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,""); },
  alle(){ return Daten.state.einrichtungen; },
  finden(name){
    const n=this._norm(name);
    return this.alle().find(e=> this._norm(e.name)===n || (e.aliase||[]).some(a=>this._norm(a)===n));
  },
  bereicheVon(name){ const e=this.finden(name); return e? (e.bereiche||[]) : []; },
  ortVon(name){ const e=this.finden(name); return e? {plz:e.plz||"",ort:e.ort||"",strasse:e.strasse||""} : null; },
  schule(){ return this.alle().find(e=>e.schule)||null; },  // Schule (für Fahrten, nicht in der Liste)
  /* Bei mehreren Bereichen den passenden über Schlüsselwörter im Einsatz-Text wählen.
     Wichtig: Fach-Schlüsselwörter im CSV-Text entscheiden, NICHT der Anstaltsname.
     (z.B. Königshof ist Psych+Akut – „…Psych" → Psych, sonst Klinik → Akut). */
  bereichFuer(name, text){
    const bs=this.bereicheVon(name); if(bs.length<=1) return bs[0]||null;
    const s=(text||name||"").toLowerCase();
    if(/\blvr\b|psychiatr|psych/.test(s) && bs.includes("Psych")) return "Psych";
    if(/kita|pädiatr|päd|paed|kinder/.test(s) && bs.includes("Päd")) return "Päd";
    if(/ambulant|pflegestation|sozialstation|station|mobil/.test(s) && bs.includes("Amb")) return "Amb";
    if(/krankenhaus|klinik|hospital|\bkh\b/.test(s) && bs.includes("Akut")) return "Akut";
    return bs[0]; // sinnvoller Default (Caritashaus->LZP)
  },
  /* Ähnliche bestehende Einrichtungen zu einem (unbekannten) Label vorschlagen. */
  aehnliche(name, n){
    const stop=new Set(["und","der","die","das","ev","gmbh","ggmbh","gbr","fur","für","am","im","st","de","neuss"]);
    const sigTok=s=>(((s||"").toLowerCase().match(/[a-zäöüß0-9]+/g))||[]).filter(t=>t.length>2&&!stop.has(t));
    const ztoks=sigTok(name); const zn=this._norm(name); if(!zn) return [];
    const score=e=>{
      const hs=new Set(sigTok(e.name+" "+(e.aliase||[]).join(" ")));
      let s=ztoks.filter(t=>hs.has(t)).length;
      const en=this._norm(e.name);
      if(en && (en.includes(zn)||zn.includes(en))) s+=2;
      return s;
    };
    return this.alle().map(e=>({e,s:score(e)})).filter(x=>x.s>0)
      .sort((a,b)=>b.s-a.s).slice(0,n||5).map(x=>x.e);
  },
  aliasHinzufuegen(ziel, label){
    if(!ziel) return; if(!ziel.aliase) ziel.aliase=[];
    if(this._norm(label)!==this._norm(ziel.name) && !ziel.aliase.some(a=>this._norm(a)===this._norm(label)))
      ziel.aliase.push(label);
  },
  async anlegen(obj){
    obj.id = obj.id || "einr-"+Date.now()+"-"+Math.floor(Math.random()*1000);
    Daten.state.einrichtungen.push(obj); await Daten.speichern("Einrichtung angelegt"); return obj;
  },
  async bearbeiten(id,obj){
    const e=this.alle().find(x=>x.id===id); if(!e) return;
    Object.assign(e,obj); await Daten.speichern("Einrichtung geändert");
  },
  async loeschen(id){
    Daten.state.einrichtungen=this.alle().filter(x=>x.id!==id);
    await Daten.speichern("Einrichtung gelöscht"); Oberflaeche.render();
  },
  merge(liste){
    liste.forEach(e=>{ if(!this.finden(e.name)) Daten.state.einrichtungen.push(e); });
  },
  /* Sicherstellen, dass eine Einrichtung existiert (lernende Liste) */
  sicherstellen(name,bereich){
    let e=this.finden(name);
    if(!e){ e={id:"einr-"+Date.now()+"-"+Math.floor(Math.random()*1000),name,bereiche:bereich?[bereich]:[],aliase:[]};
            Daten.state.einrichtungen.push(e); }
    else { if(!e.bereiche) e.bereiche=[]; if(bereich && !e.bereiche.includes(bereich)) e.bereiche.push(bereich); }
    return e;
  },
  /* Komplette eingebaute Startliste sicherstellen: fehlende ergänzen, vorhandene unberührt lassen.
     Läuft bei jedem Start → Einrichtungen sind immer geladen, eigene Einträge bleiben erhalten. */
  /* v0.20: Keine eingebaute Startliste-Konstante mehr; Einrichtungen kommen
     live aus SharePoint (Modul SharePoint). No-Op, damit bestehende Aufrufer
     (Start, Loeschen) unveraendert laufen -- aus dem Code wird nichts ergaenzt. */
  startlisteSicherstellen(){ return 0; },
  startlisteLaden(){ SharePoint.synchronisieren(true); },
  startlisteNeu(){
    if(!confirm("Die Einrichtungsliste wird frisch aus SharePoint geladen. Zentrale Einrichtungen werden dabei aktualisiert; deine eigenen, manuell angelegten Einrichtungen bleiben erhalten. Fortfahren?")) return;
    SharePoint.synchronisieren(true);
  },
  /* Model B: zentrale Einrichtungen mit SharePoint abgleichen.
     - vorhandene zentrale Eintraege aktualisieren
     - neue hinzufuegen
     - zentrale, die es in SharePoint nicht mehr gibt, entfernen
     - manuelle Eintraege (ohne _startliste) bleiben unberuehrt
     Zuordnung ueber SharePoint-ID (spId), ersatzweise ueber den Namen. */
  mitSharePointAbgleichen(spListe){
    const bericht={neu:0, geaendert:0, entfernt:0};
    const liste=Daten.state.einrichtungen || (Daten.state.einrichtungen=[]);
    const nachSpId=new Map(); const nachName=new Map();
    liste.forEach(e=>{ if(e._startliste){
      if(e.spId!=null) nachSpId.set(String(e.spId), e);
      nachName.set(this._norm(e.name), e);
    }});
    const behalten=new Set();
    const sig=e=>JSON.stringify([e.name,e.bereiche,e.plz,e.ort,e.strasse,e.aliase,!!e.stamm,!!e.schule]);
    (spListe||[]).forEach(sp=>{
      let e = (sp.spId!=null && nachSpId.get(String(sp.spId))) || nachName.get(this._norm(sp.name)) || null;
      if(e){
        const vorher=sig(e);
        e.name=sp.name; e.bereiche=(sp.bereiche||[]).slice(); e.plz=sp.plz; e.ort=sp.ort;
        e.strasse=sp.strasse; e.aliase=(sp.aliase||[]).slice(); e.stamm=!!sp.stamm; e.schule=!!sp.schule;
        e.spId=sp.spId; e._startliste=true; e._sp=true;
        if(vorher!==sig(e)) bericht.geaendert++;
        behalten.add(e);
      } else {
        const ne={ id:"einr-"+Math.random().toString(36).slice(2,9),
          name:sp.name, bereiche:(sp.bereiche||[]).slice(), plz:sp.plz, ort:sp.ort, strasse:sp.strasse,
          aliase:(sp.aliase||[]).slice(), stamm:!!sp.stamm, schule:!!sp.schule,
          spId:sp.spId, _startliste:true, _sp:true };
        liste.push(ne); behalten.add(ne); bericht.neu++;
      }
    });
    Daten.state.einrichtungen = liste.filter(e=>{
      if(e._startliste && !behalten.has(e)){ bericht.entfernt++; return false; }
      return true;
    });
    return bericht;
  },
  duplikateBereinigen(){
    const seen=new Map(); let entfernt=0;
    Daten.state.einrichtungen=this.alle().filter(e=>{
      const k=this._norm(e.name)+"|"+this._norm(e.plz)+"|"+this._norm(e.strasse);
      if(seen.has(k)){ entfernt++; return false; } seen.set(k,true); return true;
    });
    Daten.speichern(entfernt+" Duplikat(e) entfernt"); Oberflaeche.render();
  }
};

/* ---------- Eingang: Easysoft-CSV einlesen + Prüfschritt -------------- */
/* ---------- SharePoint-Synchronisation (v0.20) ---------------------------
   Meldet den Nutzer ueber Microsoft an (MSAL, Redirect-Flow) und laedt die
   Einrichtungsliste live aus SharePoint (Graph API). "Still": ist eine
   gueltige Sitzung vorhanden, laeuft alles ohne Weiterleitung im Hintergrund;
   sonst startet der Button in den Einstellungen die einmalige Anmeldung.
   Bei Fehler (kein Netz o.ae.) bleibt der zuletzt gespeicherte Stand in der
   lokalen Datenbank aktiv. */
const SharePoint = {
  _msal: null,
  _initPromise: null,
  status: "unbekannt",   /* unbekannt | abgemeldet | angemeldet | laden | ok | fehler */
  _statusText: "",
  istAdmin: false,        /* v0.25: nur waehrend der laufenden Sitzung gueltig, siehe SPSync.istAdmin() */

  verfuegbar(){ return (typeof msal !== "undefined") && msal && msal.PublicClientApplication; },

  _init(){
    if(this._initPromise) return this._initPromise;
    const self=this;
    this._initPromise = (async () => {
      if(!self.verfuegbar()){ self.status="fehler"; self._statusText="Microsoft-Login nicht verfuegbar"; return; }
      const redirectUri = window.location.href.split("#")[0].split("?")[0];
      self._msal = new msal.PublicClientApplication({
        auth: {
          clientId: SP_CONFIG.clientId,
          authority: "https://login.microsoftonline.com/" + SP_CONFIG.tenantId,
          redirectUri
        },
        cache: { cacheLocation: "localStorage" }
      });
      await self._msal.initialize();
      try {
        const resp = await self._msal.handleRedirectPromise();
        if(resp){ self.status="angemeldet"; }
      } catch(e){ self._melden("Anmeldung fehlgeschlagen: " + ((e&&e.message)||e), true); }
    })();
    return this._initPromise;
  },

  _konto(){ const a=this._msal ? this._msal.getAllAccounts() : []; return (a && a.length) ? a[0] : null; },

  async _tokenStill(){
    await this._init();
    if(!this._msal) return null;
    const konto=this._konto();
    if(!konto){ this.status="abgemeldet"; return null; }
    try {
      const r=await this._msal.acquireTokenSilent({ scopes: SP_CONFIG.scopes, account: konto });
      this.status="angemeldet";
      return r.accessToken;
    } catch(e){ this.status="abgemeldet"; return null; }
  },

  /* App-Start: nur STILL versuchen (kein Redirect). */
  async start(){
    await this._init();
    this._statusAnzeigen();
    const token=await this._tokenStill();
    if(token){ await this._ladenUndSyncen(token); }
    this._statusAnzeigen();
  },

  /* Button: still versuchen; sonst ANMELDEN (Weiterleitung). */
  async synchronisieren(interaktiv){
    await this._init();
    if(!this._msal){ this._melden("Microsoft-Anmeldung steht in dieser Umgebung nicht zur Verfuegung.", true); return; }
    let token=await this._tokenStill();
    if(!token){
      if(interaktiv){
        this._melden("Weiterleitung zur Microsoft-Anmeldung ...");
        try { await this._msal.loginRedirect({ scopes: SP_CONFIG.scopes }); }
        catch(e){ this._melden("Anmeldung fehlgeschlagen: " + ((e&&e.message)||e), true); }
        return; /* Seite laedt nach der Rueckkehr neu; start() uebernimmt. */
      } else {
        this._melden("Nicht angemeldet -- bitte einmalig anmelden.", true);
        return;
      }
    }
    await this._ladenUndSyncen(token);
    this._statusAnzeigen();
  },

  /* Wie synchronisieren(), aber die Anmeldung läuft als POPUP (kein Seiten-Reload).
     Genutzt im Onboarding-Wizard, damit der Wizard-Zustand die Anmeldung überlebt.
     Gibt true bei Erfolg zurück, wirft bei Abbruch/Fehler. */
  async synchronisierenPopup(){
    await this._init();
    if(!this._msal){ this._melden("Microsoft-Anmeldung steht in dieser Umgebung nicht zur Verfuegung.", true); throw new Error("kein MSAL"); }
    let token=await this._tokenStill();
    if(!token){
      this._melden("Anmeldung ...");
      await this._msal.loginPopup({ scopes: SP_CONFIG.scopes });   /* kleines Fenster, kein Reload */
      token=await this._tokenStill();
    }
    if(!token) throw new Error("kein Token nach Anmeldung");
    await this._ladenUndSyncen(token);
    this._statusAnzeigen();
    return true;
  },

  async _graphGet(url, token){
    const r=await fetch(url, { headers: { "Authorization": "Bearer " + token } });
    const data=await r.json();
    if(!r.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + r.status));
    return data;
  },

  /* Ein SharePoint-Eintrag -> App-Einrichtung. Bereiche/Aliase sind in
     SharePoint als "; "-getrennter Text gespeichert -> werden zu Arrays. */
  _mapItem(fields){
    const F=SP_FELDER;
    const txt=(k)=> (fields[k] != null ? String(fields[k]) : "");
    const name = txt(F.name) || txt("Title");   /* Fallback: SharePoint-Standardspalte "Title" */
    const liste=(k)=> txt(k).split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean);
    const jaNein=(v)=> v===true || v==="true" || v==="Ja" || v==="ja" || v==="1" || v===1;
    return {
      name: name,
      bereiche: liste(F.bereiche),
      plz:  txt(F.plz),
      ort:  txt(F.ort),
      strasse: txt(F.strasse),
      aliase: liste(F.aliase),
      stamm:  jaNein(fields[F.stamm]),
      schule: jaNein(fields[F.schule])
    };
  },

  async _ladenVonSharePoint(token){
    const site=await this._graphGet(
      "https://graph.microsoft.com/v1.0/sites/" + SP_CONFIG.host + ":" + SP_CONFIG.sitePath, token);
    const listsResp=await this._graphGet(
      "https://graph.microsoft.com/v1.0/sites/" + site.id + "/lists", token);
    const list=(listsResp.value||[]).find(l=> l.displayName===SP_CONFIG.listName || l.name===SP_CONFIG.listName);
    if(!list) throw new Error("Liste \"" + SP_CONFIG.listName + "\" nicht gefunden.");
    const itemsResp=await this._graphGet(
      "https://graph.microsoft.com/v1.0/sites/" + site.id + "/lists/" + list.id + "/items?$expand=fields&$top=999", token);
    const self=this;
    return (itemsResp.value||[]).map(function(it){
      const e=self._mapItem(it.fields||{});
      e.spId = it.id;
      return e;
    }).filter(e=> e.name);   /* Eintraege ohne Namen ueberspringen */
  },

  async _ladenUndSyncen(token){
    this.status="laden"; this._statusAnzeigen();
    let sp;
    try { sp=await this._ladenVonSharePoint(token); }
    catch(e){
      this.status="fehler";
      this._melden("Einrichtungen konnten nicht von SharePoint geladen werden -- es gilt der zuletzt gespeicherte Stand. (" + ((e&&e.message)||e) + ")", true);
      return;
    }
    const bericht=Einrichtungen.mitSharePointAbgleichen(sp);

    /* v0.22: Azubis + Einsatzplaene ebenfalls von SharePoint holen. Scheitert
       das, bleiben die Einrichtungen trotzdem aktualisiert -- die Azubidaten
       behalten dann den zuletzt geladenen Stand. */
    let azubiBericht=null, azubiFehler=null;
    try { azubiBericht=await SPSync.syncen(token); }
    catch(e){ azubiFehler=(e&&e.message)||String(e); }

    /* v0.25: Admin-Status fuer die "Nur meine/Alle"-Ansicht. Scheitert das
       (z.B. Liste "Admins" noch nicht angelegt), bleibt istAdmin=false --
       sicherer Default. */
    try { this.istAdmin=await SPSync.istAdmin(token, (this._konto()||{}).username); }
    catch(e){ this.istAdmin=false; }

    this.status = azubiFehler ? "fehler" : "ok";
    await Daten.speichern(false, true);   /* Housekeeping-Speicherung ohne Export-Erinnerung */
    if(typeof Oberflaeche!=="undefined" && Oberflaeche.render) Oberflaeche.render();

    let text="Einrichtungen aktualisiert: " + bericht.neu + " neu, " + bericht.geaendert + " geaendert, " + bericht.entfernt + " entfernt (" + sp.length + " aus SharePoint).";
    if(azubiBericht){
      text += " Azubis: " + azubiBericht.azubis + ", Einsaetze: " + azubiBericht.einsaetze + ".";
      if(azubiBericht.gesendet && azubiBericht.gesendet.ok) text += " " + azubiBericht.gesendet.ok + " eigene Aenderung(en) nachgereicht.";
      if(azubiBericht.gesendet && azubiBericht.gesendet.fehler) text += " " + azubiBericht.gesendet.fehler + " Aenderung(en) konnten NICHT gesendet werden.";
    }
    if(azubiFehler) text += " Azubis/Einsaetze konnten nicht geladen werden (" + azubiFehler + ").";
    this._melden(text, !!azubiFehler);
  },

  _melden(text, fehler){
    this._statusText = text;
    try { if(typeof Oberflaeche!=="undefined" && Oberflaeche.toast) Oberflaeche.toast(text, !!fehler); } catch(e){}
    this._statusAnzeigen();
  },

  _statusAnzeigen(){
    const el=document.getElementById("spStatus");
    if(!el) return;
    const map={ unbekannt:"-", abgemeldet:"nicht angemeldet", angemeldet:"angemeldet",
                laden:"laedt ...", ok:"aktuell", fehler:"Fehler" };
    let t="SharePoint: " + (map[this.status]||this.status);
    if(this._statusText) t += " - " + this._statusText;
    el.textContent=t;
  }
};

/* ---------- SPSync: Azubis + Einsaetze ueber SharePoint (v0.22) ------------
   Loest die rein lokale Datenhaltung der Einsatzplaene ab. SharePoint ist ab
   hier die fuehrende Quelle: der CSV-Import schreibt dorthin, die App liest
   von dort. Aenderungen am Besuchsstatus werden lokal sofort gespeichert
   (offline-first) und danach nach SharePoint geschickt; scheitert das (kein
   Netz), bleibt der Einsatz als "offen" markiert und wird beim naechsten
   Sync nachgereicht. */
const SPSync = {
  _siteId: null,
  _listIds: {},

  /* --- Graph-Grundlagen ------------------------------------------------ */
  async _site(token){
    if(this._siteId) return this._siteId;
    const s=await SharePoint._graphGet(
      "https://graph.microsoft.com/v1.0/sites/" + SP_CONFIG.host + ":" + SP_CONFIG.sitePath, token);
    this._siteId=s.id; return this._siteId;
  },
  async _liste(token, anzeigename){
    if(this._listIds[anzeigename]) return this._listIds[anzeigename];
    const site=await this._site(token);
    const r=await SharePoint._graphGet(
      "https://graph.microsoft.com/v1.0/sites/" + site + "/lists", token);
    const l=(r.value||[]).find(x=> x.displayName===anzeigename || x.name===anzeigename);
    if(!l) throw new Error("SharePoint-Liste \"" + anzeigename + "\" nicht gefunden.");
    this._listIds[anzeigename]=l.id; return l.id;
  },
  async _schreiben(url, token, methode, body){
    const opt={ method:methode, headers:{ "Authorization":"Bearer "+token } };
    if(body){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
    const r=await fetch(url, opt);
    if(r.status===204) return null;                 /* DELETE liefert keinen Inhalt */
    const daten=await r.json().catch(()=>null);
    if(!r.ok) throw new Error((daten && daten.error && daten.error.message) || ("HTTP " + r.status));
    return daten;
  },
  async _itemsUrl(token, listenname){
    const site=await this._site(token);
    const list=await this._liste(token, listenname);
    return "https://graph.microsoft.com/v1.0/sites/" + site + "/lists/" + list + "/items";
  },

  /* --- Datum/Uhrzeit ---------------------------------------------------
     Bewusst OHNE JavaScript-Date-Umrechnung: die App arbeitet mit reinen
     Datumsstrings ("2025-01-19"). Wuerde man sie durch new Date() schicken,
     verschoebe die Zeitzone das Datum um einen Tag. Deshalb wird der
     ISO-String direkt zusammengesetzt bzw. abgeschnitten. */
  _isoVon(datum){ return datum ? datum + "T00:00:00Z" : null; },
  _isoVonDatumZeit(datum, uhrzeit){
    if(!datum) return null;
    const z=(uhrzeit && /^\d{2}:\d{2}$/.test(uhrzeit)) ? uhrzeit : "00:00";
    return datum + "T" + z + ":00Z";
  },
  /* Wandelt einen SharePoint-Feldwert in ein ISO-Datum (YYYY-MM-DD).
     Normalfall: Graph liefert Datumsfelder als ISO-String -> erste 10 Zeichen.
     Sonderfall: der Excel->SharePoint-Import kann Datumsfelder als ROHE Excel-
     Serienzahl hinterlassen (z.B. 45303 = Tage seit 1899-12-30 = 2024-01-12).
     Solche Zahlen werden erkannt und umgerechnet. Alles Unbekannte -> null,
     damit kein kaputter Datumsstring die Kalender-Rechnung abstuerzen laesst. */
  _datumAus(v){
    if(v==null || v==="") return null;
    const s=String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);          // bereits ISO
    if(/^\d{4,6}$/.test(s)){                                         // Excel-Serienzahl?
      const n=Number(s);
      if(n>=20000 && n<=60000){                                     // ~1954..2064 (plausibel)
        const d=new Date(Date.UTC(1899,11,30)+n*86400000);
        return isNaN(d.getTime()) ? null : d.toISOString().slice(0,10);
      }
    }
    return null;
  },
  _zeitAus(v){
    if(!v) return null;
    const z=String(v).slice(11,16);
    return (!z || z==="00:00") ? null : z;   /* 00:00 = keine Uhrzeit erfasst */
  },

  /* --- Namens-Matching (Plan-Spec Abschnitt 4.4, erweitert v0.24) -------
     Azubis.Title enthaelt normalerweise nur den NACHNAMEN (manuell gepflegt,
     kann Fehler enthalten). Bei Geschwistern (gleicher Nachname) wird zur
     Unterscheidung zusaetzlich die Vornamens-Initiale angehaengt, Format
     "Nachname, V." (bestaetigt 16.07.2026) -- z.B. "Mueller, M." statt nur
     "Mueller". Die Easysoft-CSV liefert stets "Nachname, Vorname" und gilt
     als massgeblich. Abgleich ueber den Nachname-Teil (vor einem evtl.
     Komma) in Azubis.Title; bei mehreren Treffern zusaetzlich ueber die
     Vornamens-Initiale (falls vorhanden) und/oder den Kurs. Es wird NICHTS
     automatisch angelegt und nichts still ueberschrieben -- unklare Faelle
     gehen an den Admin zurueck. */
  nachnameAus(vollName){ return String(vollName||"").split(",")[0].trim(); },
  vornameAus(vollName){ return String(vollName||"").split(",").slice(1).join(",").trim(); },
  _norm(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); },

  /* Nachname-Teil aus Azubis.Title: alles vor einem evtl. vorhandenen Komma.
     Ohne Komma (Normalfall) unveraendert der komplette Titel. */
  _titelNachname(title){ return String(title||"").split(",")[0].trim(); },
  /* Vornamens-Initiale aus Azubis.Title im Geschwister-Format "Nachname, V.",
     sonst null. Der Punkt wird ignoriert. */
  _titelInitiale(title){
    const teile=String(title||"").split(",");
    if(teile.length<2) return null;
    const i=teile[1].trim().replace(/\.$/,"");
    return i ? this._norm(i).charAt(0) : null;
  },

  /* Kern einer Kursbezeichnung: Ausbildungstyp (PFK/PFA) + Kursnummer.
     Blendet Formatunterschiede zwischen Easysoft-CSV (z.B.
     "PFK 041  N 2024 H") und der manuell in SharePoint gepflegten Kurzform
     (z.B. "PFK N 041") aus -- die in SharePoint gepflegte Bezeichnung selbst
     wird dadurch nicht veraendert, nur fuer den Vergleich herangezogen. */
  _kursKern(kurs){
    const s=String(kurs||"").toUpperCase();
    const typ=/PFA|PFLASS/.test(s) ? "PFA" : (/PFK/.test(s) ? "PFK" : "");
    const nrM=s.match(/\b(\d{2,3})\b/);
    return typ + "-" + (nrM ? nrM[1] : "");
  },
  _kurseVergleichbar(a, b){
    if(!a || !b) return false;
    const ka=this._kursKern(a);
    return ka===this._kursKern(b) && ka!=="-";
  },

  zuordnen(csvVollName, csvKurs, azubisSp){
    const nn=this._norm(this.nachnameAus(csvVollName));
    if(!nn) return { status:"keinTreffer", kandidaten:[] };
    let kand=azubisSp.filter(a=> this._norm(this._titelNachname(a.name))===nn);
    let ueberKurs=false;

    /* Geschwister: mehrere Treffer mit gleichem Nachnamen -> Initiale des
       CSV-Vornamens gegen die Initiale in Azubis.Title abgleichen. */
    if(kand.length>1){
      const vnInitial=this._norm(this.vornameAus(csvVollName)).charAt(0);
      if(vnInitial){
        const mitInitial=kand.filter(a=> this._titelInitiale(a.name)===vnInitial);
        if(mitInitial.length) kand=mitInitial;
      }
    }

    if(kand.length>1 && csvKurs){
      const mitKurs=kand.filter(a=> this._kurseVergleichbar(a.kurs, csvKurs));
      if(mitKurs.length){ kand=mitKurs; ueberKurs=true; }
    }
    if(kand.length===0) return { status:"keinTreffer", kandidaten:[] };
    if(kand.length>1)  return { status:"mehrdeutig", kandidaten:kand };
    const treffer=kand[0];
    /* Abweichung: nur noch, wenn auch der Kern (Ausbildungstyp+Kursnummer)
       nicht zusammenpasst -- reine Formatunterschiede (Jahrgang/Halbjahr in
       der CSV, Kurzform in SharePoint) loesen keine Warnung mehr aus. */
    const abweichung = (csvKurs && !this._kurseVergleichbar(treffer.kurs, csvKurs))
      ? "Kurs weicht ab: CSV \"" + csvKurs + "\" / Azubis-Liste \"" + (treffer.kurs||"—") + "\""
      : null;
    return { status:"treffer", azubi:treffer, ueberKurs, abweichung };
  },

  /* --- Lesen ------------------------------------------------------------ */
  async azubisLaden(token){
    const url=await this._itemsUrl(token, SP_CONFIG.listAzubis);
    const r=await SharePoint._graphGet(url + "?$expand=fields&$top=999", token);
    const F=SP_FELDER_AZUBIS;
    const txt=(f,k)=> (f[k]!=null ? String(f[k]) : "");
    return (r.value||[]).map(it=>{
      const f=it.fields||{};
      return {
        spId: it.id,
        name: txt(f,F.name),
        kurs: txt(f,F.kurs),
        stammeinrichtung: txt(f,F.stammeinrichtung),
        bezugslehrer: txt(f,F.bezugslehrer),
        vorherigerBezugslehrer: txt(f,F.vorherigerBezugslehrer),
        parkendBei: txt(f,F.parkendBei),
        bemerkung: txt(f,F.bemerkung),
        praxisanleitung: txt(f,F.praxisanleitung)
      };
    }).filter(a=> a.name);
  },

  async einsaetzeLaden(token){
    const url=await this._itemsUrl(token, SP_CONFIG.listEinsaetze);
    let next=url + "?$expand=fields&$top=999";
    const alle=[];
    while(next){
      const r=await SharePoint._graphGet(next, token);
      (r.value||[]).forEach(it=> alle.push(this._einsatzAus(it)));
      next = r["@odata.nextLink"] || null;   /* Einsaetze koennen >999 werden */
    }
    return alle;
  },

  /* Zwischenspeicher fuer einen laufenden Import: eine Kurs-CSV enthaelt viele
     Azubis, und fuer jeden muss der SharePoint-Bestand bekannt sein. Ohne
     Zwischenspeicher wuerde die komplette Einsaetze-Liste pro Azubi neu geladen.
     Wird zu Beginn eines Imports gesetzt und am Ende wieder verworfen. */
  _bestandCache: null,
  _azubisCache: null,
  async _bestand(token){
    if(this._bestandCache) return this._bestandCache;
    this._bestandCache=await this.einsaetzeLaden(token);
    return this._bestandCache;
  },
  async azubisBestand(token){
    if(this._azubisCache) return this._azubisCache;
    this._azubisCache=await this.azubisLaden(token);
    return this._azubisCache;
  },

  /* v0.32 -- Neuen Azubi anlegen, wenn der CSV-Import keinen Treffer in der
     Azubis-Liste findet (Etappe 2, Teil 1). kursWert kommt bereits admin-
     bestaetigt aus dem "Azubi anlegen"-Dialog (siehe kursVorschlagAusCsv).
     Bezugslehrer/Bemerkung/Praxisanleitung bleiben bewusst leer -- werden
     spaeter manuell in SharePoint nachgetragen (siehe Dashboard-Kachel
     "Azubis ohne Bezugslehrer"). Neuer Azubi landet zusaetzlich im laufenden
     Cache, damit ein zweiter CSV-Block mit demselben (neuen) Namen im selben
     Import-Vorgang ihn ueber zuordnen() findet statt einen Duplikat anzulegen. */
  async azubiAnlegen(token, plan, kursWert){
    const url=await this._itemsUrl(token, SP_CONFIG.listAzubis);
    const F=SP_FELDER_AZUBIS;
    const felder={};
    felder[F.name]=this.nachnameAus(plan.id);
    felder[F.kurs]=kursWert||"";
    felder[F.stammeinrichtung]=plan.stammeinrichtung||"";
    felder[F.bezugslehrer]="";
    felder[F.bemerkung]="";
    felder[F.praxisanleitung]="";
    const r=await this._schreiben(url, token, "POST", { fields: felder });
    const neu={ spId: r && r.id, name: felder[F.name], kurs: felder[F.kurs],
                stammeinrichtung: felder[F.stammeinrichtung], bezugslehrer:"" };
    if(this._azubisCache) this._azubisCache.push(neu);
    return neu;
  },
  _adminsCache: null,
  /* v0.25 -- Admin-Erkennung: SharePoint-Liste "Admins" (eine Spalte mit
     Microsoft-Anmelde-Adressen). Bewusst NICHT ueber einen Namens-Text
     abgeglichen (Lehre aus den v0.24-Matching-Bugs), sondern ueber die
     eindeutige UPN des angemeldeten MSAL-Kontos. Wichtig: die App laeuft
     rein clientseitig, das ist eine Komfort-/Uebersichtsfunktion, KEINE
     echte Sicherheitsgrenze (siehe kontext-Dokumentation). */
  async adminsLaden(token){
    const url=await this._itemsUrl(token, SP_CONFIG.listAdmins);
    const r=await SharePoint._graphGet(url + "?$expand=fields&$top=999", token);
    const F=SP_FELDER_ADMINS;
    return (r.value||[]).map(it=>{
      const f=it.fields||{};
      return { spId: it.id, email: String(f[F.email]!=null ? f[F.email] : "") };
    }).filter(a=>a.email);
  },
  async adminsBestand(token){
    if(this._adminsCache) return this._adminsCache;
    this._adminsCache=await this.adminsLaden(token);
    return this._adminsCache;
  },
  /* v0.35 -- Lehrkräfte-Stammliste "Bezugslehrer" lesen (Kapazität + Aktiv-Flag). */
  async lehrerListeLaden(token){
    const url=await this._itemsUrl(token, SP_CONFIG.listBezugslehrer);
    const r=await SharePoint._graphGet(url + "?$expand=fields&$top=999", token);
    const F=SP_FELDER_BEZUGSLEHRER;
    const zahl=v=> (v!=null && v!=="") ? Number(v) : null;
    return (r.value||[]).map(it=>{
      const f=it.fields||{};
      return {
        spId: it.id,
        name: f[F.name]!=null ? String(f[F.name]) : "",
        stellenumfang: zahl(f[F.stellenumfang]),
        kapazitaet: zahl(f[F.kapazitaet]),
        aktiv: f[F.aktiv]!==false,       /* fehlt/true -> aktiv; nur explizit false = archiviert */
        /* v0.41 -- fehlt die Spalte, ist das Ergebnis false bzw. "": kein Sonderfall. */
        abwesend: f[F.abwesend]===true,
        vertretungDurch: f[F.vertretungDurch]!=null ? String(f[F.vertretungDurch]) : ""
      };
    }).filter(l=> l.name);
  },
  /* v0.35 -- Neue Lehrkraft anlegen (Admin). Zahlen nur setzen, wenn vorhanden. */
  async lehrerAnlegen(token, obj){
    const url=await this._itemsUrl(token, SP_CONFIG.listBezugslehrer);
    const F=SP_FELDER_BEZUGSLEHRER;
    const felder={};
    felder[F.name]=obj.name||"";
    if(obj.stellenumfang!=null && obj.stellenumfang!=="") felder[F.stellenumfang]=Number(obj.stellenumfang);
    if(obj.kapazitaet!=null    && obj.kapazitaet!=="")    felder[F.kapazitaet]=Number(obj.kapazitaet);
    felder[F.aktiv]=true;
    const r=await this._schreiben(url, token, "POST", { fields: felder });
    return { spId: r && r.id, name: felder[F.name],
             stellenumfang: felder[F.stellenumfang]!=null ? felder[F.stellenumfang] : null,
             kapazitaet:    felder[F.kapazitaet]!=null    ? felder[F.kapazitaet]    : null,
             aktiv: true };
  },
  /* v0.36 -- Lehrkraft ändern. Zahlenfelder werden auch geleert (null), wenn leer. */
  async lehrerAendern(token, spId, obj){
    const url=await this._itemsUrl(token, SP_CONFIG.listBezugslehrer);
    const F=SP_FELDER_BEZUGSLEHRER;
    const felder={};
    if(obj.name!=null) felder[F.name]=obj.name;
    /* v0.39: nur mitschreiben, was der Aufrufer wirklich meint. Vorher wurden
       Stellenumfang/Kapazitaet bedingungslos gesetzt -- ein Teil-Update wie
       {aktiv:false} haette beide in SharePoint auf null geschrieben.
       "" bleibt bewusst das Signal zum Leeren. */
    if(obj.stellenumfang!==undefined) felder[F.stellenumfang]=(obj.stellenumfang!=null && obj.stellenumfang!=="")?Number(obj.stellenumfang):null;
    if(obj.kapazitaet!==undefined)    felder[F.kapazitaet]   =(obj.kapazitaet!=null    && obj.kapazitaet!=="")   ?Number(obj.kapazitaet):null;
    if(obj.aktiv!=null) felder[F.aktiv]=!!obj.aktiv;
    if(obj.abwesend!=null) felder[F.abwesend]=!!obj.abwesend;
    /* v0.41: !==undefined statt !=null -- "" ist hier das gewollte Signal zum Leeren,
       genau wie bei kapazitaet. Mit !=null bliebe eine beendete Vertretung stehen. */
    if(obj.vertretungDurch!==undefined) felder[F.vertretungDurch]=obj.vertretungDurch||"";
    await this._schreiben(url + "/" + spId + "/fields", token, "PATCH", felder);
  },
  /* v0.36 -- Lehrkraft löschen. */
  async lehrerLoeschen(token, spId){
    const url=await this._itemsUrl(token, SP_CONFIG.listBezugslehrer);
    await this._schreiben(url + "/" + spId, token, "DELETE");
  },
  async istAdmin(token, upn){
    if(!upn) return false;
    let admins;
    try { admins=await this.adminsBestand(token); }
    catch(e){ return false; }   /* Liste fehlt/nicht erreichbar -> sicherheitshalber kein Admin */
    const n=this._norm(upn);
    return admins.some(a=> this._norm(a.email)===n);
  },
  cacheLeeren(){ this._bestandCache=null; this._azubisCache=null; this._adminsCache=null; },

  _einsatzAus(item){
    const f=item.fields||{}, F=SP_FELDER_EINSAETZE;
    /* pflichtManuell: die App unterscheidet null (= nicht manuell gesetzt)
       von true/false. SharePoint kennt nur Ja/Nein. Kodierung: das Ja/Nein-Feld
       sagt NUR, OB manuell gesetzt wurde -- der Wert selbst steht in
       "Pflichtbesuch". Damit ist die Ruecklesung verlustfrei. */
    const pflicht = f[F.pflichtbesuch]===true;
    return {
      spId: item.id,
      azubiSpId: f[F.azubiRef]!=null ? String(f[F.azubiRef]) : null,
      vollName: f[F.titel]!=null ? String(f[F.titel]) : "",
      typ: f[F.typ]!=null ? String(f[F.typ]) : "",
      einrichtungName: f[F.einrichtung]!=null ? String(f[F.einrichtung]) : "",
      von: this._datumAus(f[F.von]),
      bis: this._datumAus(f[F.bis]),
      std: (f[F.std]!=null && f[F.std]!=="") ? Number(f[F.std]) : null,
      pflichtbesuch: pflicht,
      pflichtManuell: (f[F.pflichtManuell]===true) ? pflicht : null,
      besuchStatus: f[F.besuchStatus] ? String(f[F.besuchStatus]) : "offen",
      besuchDatum: this._datumAus(f[F.besuchDatum]),
      besuchUhrzeit: this._zeitAus(f[F.besuchDatum]),
      besuchNotiz: f[F.besuchNotiz]!=null ? String(f[F.besuchNotiz]) : "",
      sammelbesuchId: null,
      spOffen: false
    };
  },

  _felderFuer(einsatz, azubiSpId, vollName){
    const F=SP_FELDER_EINSAETZE;
    const o={};
    o[F.titel]         = (vollName||"") + (einsatz.typ ? " · " + einsatz.typ : "");
    o[F.azubiRef]      = Number(azubiSpId);
    o[F.von]           = this._isoVon(einsatz.von);
    o[F.bis]           = this._isoVon(einsatz.bis);
    o[F.einrichtung]   = einsatz.einrichtungName || "";
    o[F.std]           = (einsatz.std!=null) ? Number(einsatz.std) : null;
    o[F.typ]           = einsatz.typ || "";
    o[F.pflichtbesuch] = !!einsatz.pflichtbesuch;
    o[F.pflichtManuell]= (einsatz.pflichtManuell != null);
    o[F.besuchStatus]  = einsatz.besuchStatus || "offen";
    o[F.besuchDatum]   = this._isoVonDatumZeit(einsatz.besuchDatum, einsatz.besuchUhrzeit);
    o[F.besuchNotiz]   = einsatz.besuchNotiz || "";
    return o;
  },

  /* --- Einsatzplan hochladen (CSV-Import, Admin) ------------------------
     Ersetzt den Einsatzplan EINES Azubis in SharePoint. Bereits erfasste
     Besuchsstaende bleiben erhalten: bestehende Eintraege werden anhand des
     Startdatums (Von) wiedererkannt und aktualisiert statt geloescht. */
  async einsatzplanHochladen(token, azubiSpId, vollName, einsaetze){
    const url=await this._itemsUrl(token, SP_CONFIG.listEinsaetze);
    const alle=await this._bestand(token);
    const bestand=alle.filter(e=> e.azubiSpId===String(azubiSpId));
    const nachVon=new Map(bestand.map(e=>[e.von, e]));
    const behalten=new Set();
    let neu=0, geaendert=0, entfernt=0;

    for(const e of einsaetze){
      const alt=nachVon.get(e.von);
      if(alt){
        /* Besuchsstand des bestehenden Eintrags bewahren, damit ein erneuter
           Import bereits erfasste Besuche nicht ueberschreibt. AUSNAHME: Bringt
           der Import selbst einen Status mit (im Pruefschritt "bereits
           durchgefuehrt" angehakt -> Status != "offen"), gewinnt diese frische
           Eingabe -- sonst wuerde die Bewahr-Logik das gerade gesetzte
           "durchgefuehrt" wieder auf den alten Wert (meist "offen") zuruecksetzen. */
        if(!e.besuchStatus || e.besuchStatus==="offen"){
          e.besuchStatus  = alt.besuchStatus;
          e.besuchDatum   = alt.besuchDatum;
          e.besuchUhrzeit = alt.besuchUhrzeit;
        }
        if(!e.besuchNotiz) e.besuchNotiz = alt.besuchNotiz;   /* Notiz gehoert zum erfassten Besuch */
        await this._schreiben(url + "/" + alt.spId + "/fields", token, "PATCH",
                              this._felderFuer(e, azubiSpId, vollName));
        e.spId=alt.spId; behalten.add(alt.spId); geaendert++;
      } else {
        const r=await this._schreiben(url, token, "POST",
                { fields: this._felderFuer(e, azubiSpId, vollName) });
        e.spId = r && r.id; neu++;
      }
      e.spOffen=false;
    }
    for(const alt of bestand){
      if(behalten.has(alt.spId)) continue;
      await this._schreiben(url + "/" + alt.spId, token, "DELETE");
      entfernt++;
    }
    /* Zwischenspeicher auf den neuen Stand bringen: Eintraege dieses Azubis
       ersetzen. So bleibt er fuer die uebrigen Azubis der CSV gueltig. */
    this._bestandCache = alle.filter(e=> e.azubiSpId!==String(azubiSpId))
      .concat(einsaetze.map(e=> Object.assign({}, e, {azubiSpId:String(azubiSpId), vollName})));
    return {neu, geaendert, entfernt};
  },

  /* --- Einzelnen Besuchsstand zurueckschreiben -------------------------- */
  async besuchSenden(azubi, einsatz){
    if(!einsatz.spId || !azubi.spId){ einsatz.spOffen=true; return false; }
    let token=null;
    try { token=await SharePoint._tokenStill(); } catch(e){ token=null; }
    if(!token){ einsatz.spOffen=true; return false; }
    try{
      const url=await this._itemsUrl(token, SP_CONFIG.listEinsaetze);
      await this._schreiben(url + "/" + einsatz.spId + "/fields", token, "PATCH",
                            this._felderFuer(einsatz, azubi.spId, einsatz.vollName || Azubis.name(azubi.id)));
      einsatz.spOffen=false;
      return true;
    }catch(e){
      einsatz.spOffen=true;
      return false;
    }
  },

  /* v0.40: Waere der interne Name von SP_FELDER_AZUBIS.vorherigerBezugslehrer falsch,
     lehnte SharePoint den GANZEN PATCH ab -- also auch den Bezugslehrer, der seit
     v0.34 laeuft. Eine verlorene Zuordnung wiegt ungleich schwerer als ein verlorener
     Merker, deshalb wird einmal ohne das neue Feld nachgefasst.
     Genutzt von bezugslehrerSenden UND offeneSenden.

     v0.40.2: Der Name ist inzwischen bestaetigt (Listeneinstellungen, 26.07.2026) --
     das Nachfassen ist damit Vorsorge, kein erwarteter Fall. Es bleibt trotzdem
     stehen: eine Spalte kann umbenannt werden, und der Preis dafuer, dass eine
     Zuordnung wegen eines Merkers verloren geht, waere hoeher.

     v0.40.2: Dieses Nachfassen war stumm -- kein Log, kein Hinweis. Die App
     behauptete damit vollen Erfolg, obwohl die Haelfte verschluckt wurde; genau
     dieser Fehlertyp blieb bei BesuchStatus wochenlang unbemerkt. Der Teil-Erfolg
     wird jetzt zweifach vermerkt: am Azubi (vorgaengerOffen, fuer die Meldung
     direkt nach dem Handgriff) und im State (schreibDefekt, fuer den stehenden
     Hinweis -- der Toast ist nach Sekunden weg, die Ursache bleibt).
     Ein spaeter gelungener voller PATCH loescht den Vermerk wieder: der Marker
     beschreibt den letzten Stand, nicht die Vergangenheit. */
  async _bezugslehrerPatch(url, token, azubi){
    const felder={};
    felder[SP_FELDER_AZUBIS.bezugslehrer]=azubi.bezugslehrer||"";
    felder[SP_FELDER_AZUBIS.vorherigerBezugslehrer]=azubi.vorherigerBezugslehrer||"";
    /* v0.41.1: ParkendBei laeuft im selben PATCH mit und faellt beim Nachfassen
       mit dem Vorgaenger zusammen weg. Welches der beiden Felder SharePoint
       ablehnt, sagt die Antwort nicht -- deshalb nennt die Meldung beide. */
    felder[SP_FELDER_AZUBIS.parkendBei]=azubi.parkendBei||"";
    try{
      await this._schreiben(url, token, "PATCH", felder);
      azubi.vorgaengerOffen=false;
      if(Daten.state) Daten.state.schreibDefekt=null;
    }catch(e){
      const nurBezugslehrer={};
      nurBezugslehrer[SP_FELDER_AZUBIS.bezugslehrer]=azubi.bezugslehrer||"";
      /* Scheitert auch das, fliegt der Fehler weiter -- dann ist gar nichts
         angekommen und der Aufrufer setzt blOffen. */
      await this._schreiben(url, token, "PATCH", nurBezugslehrer);
      azubi.vorgaengerOffen=true;
      if(Daten.state) Daten.state.schreibDefekt={
        feld: SP_FELDER_AZUBIS.vorherigerBezugslehrer+" / "+SP_FELDER_AZUBIS.parkendBei,
        grund: String((e&&e.message)||e||""),
        wann: new Date().toISOString() };
    }
  },

  /* v0.34: Bezugslehrer-Zuordnung eines Azubis nach SharePoint schreiben
