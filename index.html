      if(!haus){ e.ohne++; return; }
      e.zaehler.set(haus,(e.zaehler.get(haus)||0)+1);
    });
    const raus=new Map();
    roh.forEach((v,k)=>{
      let top=null;
      /* Gleichstand: alphabetisch, damit die Anzeige stabil bleibt (kein Flackern). */
      v.zaehler.forEach((n,name)=>{
        if(!top || n>top.anzahl || (n===top.anzahl && name.localeCompare(top.name,"de")<0)) top={name,anzahl:n};
      });
      raus.set(k, top ? {name:top.name, anzahl:top.anzahl, gesamt:v.gesamt,
                         verschiedene:v.zaehler.size, ohne:v.ohne} : null);
    });
    return raus;
  },
  /* v0.40: Welche Azubis haengen an welcher Lehrkraft? Schluessel ist der
     ROHwert des Bezugslehrer-Felds -- derselbe Ausdruck wie in auslastung()
     (String(a.bezugslehrer||"").trim()). NICHT normalisiert: auslastung()
     bildet je Rohwert eine eigene Tabellenzeile, und deren Ist-Wert muss zur
     Laenge der hier gelieferten Liste passen. Wuerde hier normalisiert, faellt
     die Gruppierung bei "Musterfrau (10)" vs. "Musterfrau (12)" zusammen und
     beide Zeilen zeigen dieselbe zusammengefuehrte Liste -- Zeile und Kacheln
     liefen auseinander.
     Die Namen kommen als Parameter statt aus Daten.state, damit die Funktion
     ohne globalen Zustand geprueft werden kann. Sortierung ueber opt.sortierung
     ("kurs" | "haus" | "name"), Standard "kurs", damit Azubis desselben Kurses
     als Kacheln zusammenstehen. */
  azubisJeLehrkraft(azubis, namen, opt){
    const raus=new Map();
    (azubis||[]).forEach(a=>{
      const w=String((a&&a.bezugslehrer)||"").trim(); if(!w) return;
      if(!raus.has(w)) raus.set(w,[]);
      raus.get(w).push({ id:a.id,
                         name:((namen||{})[a.id])||a.kuerzel||"",
                         kurs:a.kurs||"",
                         stammeinrichtung:a.stammeinrichtung||"",
                         /* v0.41.1: Der Park-Marker gilt auch hier. Wer waehrend
                            einer Abwesenheit weitergegeben wurde, sitzt in einer
                            fremden Gruppe und geht spaeter trotzdem zurueck --
                            ohne Marker waere das an dieser Kachel unsichtbar. */
                         wartetAuf: bezugslehrerAnzeige(a.parkendBei||"")||"" });
    });
    const nachName=(x,y)=> x.name.localeCompare(y.name,"de");
    const s=(opt&&opt.sortierung)||"kurs";
    /* Leerer Kurs bzw. leeres Haus ans Ende -- sonst stuenden sie als leerer
       Wert ganz oben. Gleiches Mittel wie in offeneAzubis(). */
    const hinten=v=> v || "￿";
    raus.forEach(liste=> liste.sort((x,y)=>
      s==="name" ? nachName(x,y)
    : s==="haus" ? (hinten(x.stammeinrichtung).localeCompare(hinten(y.stammeinrichtung),"de") || nachName(x,y))
    :              (hinten(x.kurs).localeCompare(hinten(y.kurs),"de") || nachName(x,y))));
    return raus;
  },
  /* v0.40.3: Farbton je Kurs -- berechnet, nicht gespeichert. Dieselbe Farbe
     bedeutet bei jeder Lehrkraft denselben Kurs, ohne dass irgendwo eine
     Zuordnung gepflegt werden muesste. Die Farbe ist Zugabe: der Kurs steht als
     Text auf der Kachel, niemand ist auf sie angewiesen.

     Der Ton kommt aus dem RANG im sortierten Kursverzeichnis, nicht mehr aus
     einer Quersumme ueber den Namen (v0.40.1). Die Quersumme traf sich: In der
     Abnahme hatten "PFK T 041" und "PflAss 12" dieselbe Farbe -- bei acht Toepfen
     und drei Kursen kollidiert rund jeder dritte Fall. Auch ein feiner verteilter
     Zufallston hilft nicht zuverlaessig; zwei Kurse landeten 6 Grad auseinander,
     das ist mit blossem Auge dieselbe Farbe. Der Rang kann sich nicht treffen.

     Preis: Kommt ein Kurs dazu, ruecken die Toene der anderen. Das ist vertretbar
     -- die Farbe gruppiert, was nebeneinander steht; sie ist kein Merkmal, das
     sich jemand ueber Wochen merkt. */
  kursFarben(azubis){
    const kurse=[...new Set((azubis||[]).map(a=>SPSync._norm((a&&a.kurs)||"")).filter(Boolean))].sort();
    const raus=new Map();
    kurse.forEach((k,i)=> raus.set(k, Math.round(i*360/kurse.length)));
    return raus;
  },

  /* v0.40: Wie steht die Ziel-Lehrkraft da, NACHDEM ein Azubi dazukommt?
     Traegt die Warnung, die frueher ein Bestaetigungsdialog gegeben haette.
     Ohne hinterlegte Kapazitaet gibt es nichts zu ueberschreiten. */
  ueberbuchtNach(zeilen, zielWert){
    const k=SPSync._norm(bezugslehrerAnzeige(zielWert||"")||zielWert||"");
    const z=(zeilen||[]).find(x=> SPSync._norm(bezugslehrerAnzeige(x.wert)||x.wert)===k);
    if(!z) return null;
    const ist=z.ist+1;
    const soll=(z.soll!=null)?z.soll:null;
    return { ist, soll, ueberbucht: soll!==null && ist>soll };
  },

  /* v0.40: Text der Rueckmeldung nach einem Handgriff. Bewusst hier und nicht in
     der Oberflaeche: die Kapazitaets-Aussage ist der Teil, der stimmen muss. */
  umhaengenMeldung(azubiName, vonName, nachName, kap){
    const von=String(vonName||"").trim()||"ohne Zuordnung";
    const nach=String(nachName||"").trim()||"ohne Zuordnung";
    const zusatz=(kap && kap.ueberbucht) ? ` · jetzt ${kap.ist} / ${kap.soll}` : "";
    return `${azubiName}: ${von} → ${nach}${zusatz}`;
  },

  /* ---------- v0.41: Vertretung bei laengerer Abwesenheit ------------------
     Alles Pruefbare liegt hier und nicht in Oberflaeche -- die ist headless
     nicht testbar. Verglichen wird durchgehend ueber _norm(bezugslehrerAnzeige(..)),
     weil dieselbe Lehrkraft mal mit und mal ohne "(Zahl)" geschrieben wird. */
  _blSchluessel(wert){ return SPSync._norm(bezugslehrerAnzeige(wert||"")||wert||""); },

  /* Wer kann vertreten? Nicht sie selbst, nicht Archivierte, nicht wer selbst
     abwesend ist (sonst vertritt jemand, der auch fehlt), und keine Nur-Text-
     Lehrkraft -- fuer die gibt es keinen Datensatz, den man beschreiben koennte.
     v0.41.1: Die Auswahl vermerkt nur noch, wer einspringt -- die Azubis gehen
     nach "Ohne Zuordnung". Die Liste bleibt trotzdem dieselbe: als Vertretung
     taugt weiterhin nur, wer da und aktiv ist. */
  vertretungKandidaten(zeilen, eigenerWert){
    const eigen=this._blSchluessel(eigenerWert);
    return (zeilen||[]).filter(z=> z.inListe && z.aktiv && !z.abwesend
                                   && this._blSchluessel(z.wert)!==eigen);
  },

  /* Was passiert, wenn A abwesend gemeldet wird? Liefert die betroffenen Azubis
     MIT NAMEN (Entscheidung 1 der Spec: eine blosse Zahl laesst sich nicht
     pruefen).
     v0.41.1: Sie gehen nach "Ohne Zuordnung" statt an eine Vertretung -- damit
     entfaellt das Zielziel und mit ihm die Kapazitaets-/Ueberbuchungsvorschau.
     Eine Ueberbuchung kann hier nicht mehr entstehen: die Ablage hat kein Soll. */
  abwesenheitVorschau(azubis, namen, vonWert){
    const von=this._blSchluessel(vonWert);
    if(!von) return { azubis:[], anzahl:0 };
    const betroffen=(azubis||[])
      .filter(a=> this._blSchluessel(a && a.bezugslehrer)===von)
      .map(a=> ({ id:a.id, name:((namen||{})[a.id])||a.kuerzel||"" }));
    return { azubis:betroffen, anzahl:betroffen.length };
  },

  /* "Ist zurueck": zurueck geholt wird nur, wer BEI DER VERTRETUNG liegt und
     von A kam. Ein Azubi mit vorheriger=A, der inzwischen bei einer dritten
     Lehrkraft liegt, ist eine bewusste Abgabe und gehoert nach "anderswo" --
     sonst dreht die Aktion mehr zurueck, als sie ankuendigt.

     v0.41.1 kehrt diese Regel auf Christians Entscheidung um: Zurueck kommt
     JEDER, der auf A wartet -- ob er ohne Zuordnung liegt, bei der Vertretung
     oder inzwischen bei einer dritten Lehrkraft. Moeglich wird das erst durch
     ParkendBei: vorherigerBezugslehrer merkt nur eine Station und waere beim
     Weitergeben ueberschrieben.
     Wo einer gerade liegt, steht als "bei" am Eintrag -- der Dialog nennt es,
     damit ein Rueckholen von einer dritten Lehrkraft nicht unbemerkt passiert.
     Altbestand aus v0.41.0 hat kein ParkendBei; dort greift der Vorgaenger-Weg,
     damit die Azubis einer laufenden Abwesenheit nicht unauffindbar werden. */
  rueckschubKandidaten(azubis, namen, zeile){
    const leer={ zurueck:[] };
    if(!zeile) return leer;
    const a=this._blSchluessel(zeile.wert);
    if(!a) return leer;
    const vertretung=this._blSchluessel(zeile.vertretungDurch);
    const raus={ zurueck:[] };
    (azubis||[]).forEach(x=>{
      if(!x) return;
      const wartet=this._blSchluessel(x.parkendBei)===a;
      /* Altbestand: ohne ParkendBei zaehlt, wer von A kam und noch ungeordnet
         liegt oder bei der eingetragenen Vertretung. */
      const alt=!String(x.parkendBei||"").trim()
             && this._blSchluessel(x.vorherigerBezugslehrer)===a
             && (!String(x.bezugslehrer||"").trim()
                 || (!!vertretung && this._blSchluessel(x.bezugslehrer)===vertretung));
      if(!wartet && !alt) return;
      raus.zurueck.push({ id:x.id, name:((namen||{})[x.id])||x.kuerzel||"",
                          bei: bezugslehrerAnzeige(x.bezugslehrer||"")||"" });
    });
    return raus;
  },

  /* Text der Status-Pille. Bewusst hier und nicht in der Oberflaeche: dass die
     "(Zahl)" wegfaellt und dass ohne Vertretung nur "abwesend" dasteht, sind
     pruefbare Regeln -- das Markup drumherum ist es nicht. */
  abwesenheitsText(z){
    if(!z || !z.abwesend) return "";
    const v=bezugslehrerAnzeige(z.vertretungDurch||"");
    return v ? "abwesend · vertreten durch "+v : "abwesend";
  },

  /* Meldung nach einem Gruppen-Schreibvorgang. Anschluss an v0.40.2: ein halb
     gelungener Vorgang darf nicht als Erfolg aussehen, ein komplett
     gescheiterter erst recht nicht. */
  gruppenMeldung(ok, offen, was){
    const gut=Number(ok)||0, fehlt=Number(offen)||0, gesamt=gut+fehlt;
    const wo=String(was||"").trim();
    /* Ohne Schlusspunkt -- wie umhaengenMeldung und schreibHinweis daneben. */
    if(gesamt===0) return "Keine Azubis betroffen";
    if(fehlt===0)  return gesamt+" Azubi"+(gesamt===1?"":"s")+(wo?" "+wo:"");
    if(gut===0)    return "Kein Azubi konnte übertragen werden, "+gesamt+" werden nachgereicht";
    return gut+" von "+gesamt+" übertragen, "+fehlt+" werden nachgereicht";
  },

  /* v0.40.2: Zusatz zur Meldung nach einem Schreibvorgang. Die Sync-Warnung stand
     bisher als Ternaer in der Oberflaeche (nicht testbar), der Teil-Erfolg nirgends.
     Reihenfolge ist Absicht: "nichts angekommen" wiegt schwerer als "Merker fehlt"
     und verdraengt es -- zwei Zusaetze in einer Zeile liest niemand. */
  schreibHinweis(azubi){
    if(!azubi) return "";
    if(azubi.blOffen)         return " · noch nicht in SharePoint";
    if(azubi.vorgaengerOffen) return " · Vorgänger nicht gemerkt";
    return "";
  },

  /* v0.40.2: Text des stehenden Hinweises, solange SharePoint eine Spalte ablehnt.
     Bewusst unabhaengig davon, ob noch markierte Azubis vorliegen: der Sync ersetzt
     die Azubi-Liste komplett (azubisLaden ist fuehrend), die Flags sind danach weg --
     die abgelehnte Spalte ist damit aber nicht in Ordnung. Ohne Zahl bleibt der
     Hinweis stehen, mit Zahl nennt er den Umfang. */
  schreibDefektMeldung(st){
    const d=st && st.schreibDefekt;
    if(!d || !d.feld) return null;
    const n=(st.azubis||[]).filter(a=>a && a.vorgaengerOffen).length;
    const umfang = n ? ` Betrifft ${n===1?"1 Azubi":n+" Azubis"} seit dem letzten Abgleich.` : "";
    return `SharePoint nimmt die Spalte „${d.feld}“ nicht an. Zuordnungen werden `
         + `gespeichert, die Merker für Vorgänger und Abwesenheit aber nicht – `
         + `„Ist zurück“ hätte damit nichts, worauf es zurückgreifen kann.${umfang} `
         + `Bitte den internen Feldnamen in den Listeneinstellungen prüfen.`;
  },
  /* v0.40: Inhalt der Zuordnungs-Spalte. Standard ist die Sortierung nach
     Traegerhaus: Ein frisch importierter Kurs wird meist hausweise verteilt --
     so stehen die Azubis zusammen, die zur selben Lehrkraft gehen, und die
     Schwerpunkt-Spalte der Tabelle zeigt, zu welcher. Azubis ohne Haus kommen
     ans Ende (sonst stuenden sie als leerer Wert ganz oben). */
  offeneAzubis(azubis, namen, opt){
    const o=opt||{};
    const q=SPSync._norm(o.suche||"");
    const liste=(azubis||[])
      .filter(a=> a && !String(a.bezugslehrer||"").trim())
      .map(a=>({ id:a.id,
                 name:((namen||{})[a.id])||a.kuerzel||"",
                 kurs:a.kurs||"",
                 stammeinrichtung:a.stammeinrichtung||"",
                 /* v0.40.1: ohne "(Zahl)" -- auf dem Chip zaehlt der Name, nicht
                    die Kapazitaet der fruheren Lehrkraft. */
                 vorher: bezugslehrerAnzeige(a.vorherigerBezugslehrer||"")||"",
                 /* v0.41.1: Der Park-Marker -- steht in ParkendBei und sagt, dass
                    dieser Azubi zu einer abwesenden Lehrkraft zurueckgehoert und
                    nicht frei zu verplanen ist. */
                 wartetAuf: bezugslehrerAnzeige(a.parkendBei||"")||"" }))
      .filter(a=> !q || SPSync._norm(a.name).indexOf(q)>=0 || SPSync._norm(a.kurs).indexOf(q)>=0);
    const nachName=(x,y)=> x.name.localeCompare(y.name,"de");
    if((o.sortierung||"haus")==="haus"){
      const h=x=> x.stammeinrichtung || "￿";     /* leer sortiert hinter alles */
      liste.sort((x,y)=> h(x).localeCompare(h(y),"de") || nachName(x,y));
    } else {
      liste.sort(nachName);
    }
    return liste;
  },
  /* v0.37: Suche/Filter/Sortierung der Lehrkraft-Tabelle. Rein funktional (kein
     DOM) -- damit headless testbar. "alle" blendet Archivierte aus; "frei" ist der
     direkte Weg zur haeufigsten Frage beim Zuordnen: wer hat ueberhaupt noch Platz?
     v0.38: Die Suche greift auch auf das Schwerpunkt-Traegerhaus -- so findet man
     ueber den Hausnamen die Lehrkraefte, die dort ohnehin betreuen. */
  lehrkraftFiltern(zeilen, opt){
    const o=opt||{};
    const q=SPSync._norm(o.suche||"");
    const modus=o.modus||"alle";
    const raus=(zeilen||[]).filter(z=>{
      if(q){
        const imNamen=SPSync._norm(z.name).indexOf(q)>=0;
        const imHaus=!!(z.einrichtung && SPSync._norm(z.einrichtung.name).indexOf(q)>=0);
        if(!imNamen && !imHaus) return false;
      }
      if(modus==="archiviert")  return !z.aktiv;
      if(!z.aktiv)              return false;
      /* v0.41: Wer abwesend ist, hat keine freie Kapazitaet -- sonst schlaegt die
         Verteilung genau die Lehrkraft vor, die gerade nicht da ist. Ist/Soll und
         Ampel bleiben unveraendert: 0/25 ist bei ihr die Wahrheit. */
      if(modus==="frei")        return z.frei!=null && z.frei>0 && !z.abwesend;
      if(modus==="ueberlastet") return z.ampel==="rot";
      return true;
    });
    /* Ohne "name" bleibt die Reihenfolge aus auslastung(): hoechste Last zuerst. */
    return (o.sortierung==="name")
      ? raus.slice().sort((a,b)=> String(a.name).localeCompare(String(b.name),"de"))
      : raus;
  },
  /* v0.39: Welche Punkte das ⋮-Menü einer Lehrkraft-Zeile traegt. Reine Logik --
     das Popover selbst ist Browser-Sache und nicht headless pruefbar.
     Ohne spId (nur als Text am Azubi) gibt es nichts zu bearbeiten -> kein Menue. */
  lehrkraftAktionen(z){
    if(!z || !z.inListe) return [];
    const punkte=[
      {id:"edit",   label:"Bearbeiten"},
      {id:"archiv", label: z.aktiv ? "Archivieren" : "Reaktivieren"},
    ];
    /* v0.41: nur bei aktiven Lehrkraeften. Eine archivierte vertreten zu lassen
       ergibt keinen Sinn -- sie betreut niemanden mehr. Loeschen bleibt letzter
       Punkt, damit der gefaehrliche Eintrag nicht mitten in der Liste steht. */
    if(z.aktiv && !z.abwesend) punkte.push({id:"abwesend", label:"Als abwesend melden"});
    if(z.aktiv &&  z.abwesend) punkte.push({id:"zurueck",  label:"Ist zurück"});
    punkte.push({id:"del", label:"Löschen", gefahr:true});
    return punkte;
  },
  /* v0.39: Einrichtungen bekommen bewusst KEIN Archivieren -- fuer die Liste
     existiert kein Schreibweg nach SharePoint, ein solcher Knopf wuerde nur
     lokal wirken und beim naechsten Sync verpuffen. */
  einrichtungAktionen(){
    return [
      {id:"edit", label:"Bearbeiten"},
      {id:"del",  label:"Löschen", gefahr:true},
    ];
  },
};

/* ---------- Bezugslehrer: Lehrkräfte-Stammliste (v0.35) ----------------
   Eigene SharePoint-Liste "Bezugslehrer" als saubere Quelle für Kapazität +
   Existenz (statt nur abgeleitet aus dem Azubi-Textfeld). Scheibe 1a: lesen +
   anlegen. Kapazitäts-/Board-Umstellung + Archivieren folgen in Scheibe 1b/2. */
const Bezugslehrer = {
  alle(){ return (Daten.state && Daten.state.lehrer) || []; },
  aktive(){ return this.alle().filter(l=> l.aktiv!==false); },
  /* Lehrkraft zu einem (evtl. mit "(Zahl)" behafteten) Bezugslehrer-Wert finden. */
  finden(wert){
    const n=SPSync._norm(bezugslehrerAnzeige(wert)||wert);
    return this.alle().find(l=> SPSync._norm(l.name)===n) || null;
  },
  /* Kapazitäts-Vorschlag: 100 % Stelle = 25 Azubis (Christian, 24.07.2026).
     Gerundet, editierbar -- für Sonderfälle überschreibt der Admin. */
  kapazitaetVorschlag(stellenumfang){
    const s=Number(stellenumfang);
    if(!isFinite(s) || s<=0) return null;
    return Math.round(s/100*25);
  },
  /* Neue Lehrkraft anlegen (Admin). Erst SharePoint, dann lokal in den State. */
  async anlegen(name, stellenumfang, kapazitaet){
    let token=null;
    try { token=await SharePoint._tokenStill(); } catch(e){ token=null; }
    if(!token){ Oberflaeche.toast("Nicht bei SharePoint angemeldet – Bezugslehrer kann nicht angelegt werden.", true); return null; }
    try{
      const neu=await SPSync.lehrerAnlegen(token, {name, stellenumfang, kapazitaet});
      if(!Array.isArray(Daten.state.lehrer)) Daten.state.lehrer=[];
      Daten.state.lehrer.push(neu);
      await Daten.speichern("Bezugslehrer angelegt");
      return neu;
    }catch(e){
      Oberflaeche.toast("Bezugslehrer konnte nicht angelegt werden: " + ((e&&e.message)||e), true);
      return null;
    }
  },
  /* Kanonischer Bezugslehrer-Rohwert "Name (Kapazität)" -- so bleibt die bestehende
     "(Zahl)"-Konvention erhalten (Fallback für soll(), Anzeige via bezugslehrerAnzeige). */
  wertFuer(l){ return (l&&l.name?l.name:"") + (l&&l.kapazitaet!=null ? " ("+l.kapazitaet+")" : ""); },
  /* Wie viele Azubis sind dieser Lehrkraft aktuell (per Name) zugeordnet? */
  azubiAnzahl(l){
    const nn=SPSync._norm(l&&l.name); if(!nn) return 0;
    return ((Daten.state&&Daten.state.azubis)||[]).filter(a=> SPSync._norm(bezugslehrerAnzeige(a.bezugslehrer))===nn).length;
  },
  /* Lehrkraft ändern (Name/Stellenumfang/Kapazität/Aktiv). Erst SharePoint, dann lokal. */
  async aendern(spId, obj){
    let token=null; try { token=await SharePoint._tokenStill(); } catch(e){ token=null; }
    if(!token){ Oberflaeche.toast("Nicht angemeldet – Änderung nicht möglich.", true); return false; }
    try{
      await SPSync.lehrerAendern(token, spId, obj);
      const l=this.alle().find(x=>String(x.spId)===String(spId));
      if(l){
        if(obj.name!=null) l.name=obj.name;
        if(obj.stellenumfang!==undefined) l.stellenumfang=(obj.stellenumfang!=null && obj.stellenumfang!=="")?Number(obj.stellenumfang):null;
        if(obj.kapazitaet!==undefined)    l.kapazitaet   =(obj.kapazitaet!=null    && obj.kapazitaet!=="")   ?Number(obj.kapazitaet):null;
        if(obj.aktiv!=null) l.aktiv=!!obj.aktiv;
        /* v0.41: gleiche Bedingungen wie in SPSync.lehrerAendern -- sonst weicht
           der lokale Stand von dem ab, was in SharePoint steht. */
        if(obj.abwesend!=null) l.abwesend=!!obj.abwesend;
        if(obj.vertretungDurch!==undefined) l.vertretungDurch=obj.vertretungDurch||"";
      }
      await Daten.speichern("Bezugslehrer geändert");
      return true;
    }catch(e){ Oberflaeche.toast("Änderung fehlgeschlagen: "+((e&&e.message)||e), true); return false; }
  },
  /* Lehrkraft löschen (nur sinnvoll ohne zugeordnete Azubis -- Aufrufer prüft das). */
  async loeschen(spId){
    let token=null; try { token=await SharePoint._tokenStill(); } catch(e){ token=null; }
    if(!token){ Oberflaeche.toast("Nicht angemeldet – Löschen nicht möglich.", true); return false; }
    try{
      await SPSync.lehrerLoeschen(token, spId);
      Daten.state.lehrer=this.alle().filter(x=>String(x.spId)!==String(spId));
      await Daten.speichern("Bezugslehrer gelöscht");
      return true;
    }catch(e){ Oberflaeche.toast("Löschen fehlgeschlagen: "+((e&&e.message)||e), true); return false; }
  }
};

/* =========================================================================
   v0.27: Onboarding-Wizard (Etappe 1 -- rein lokale + informative Schritte)
   Spotlight-Konzept: schaltet in die ECHTE UI (Tab/Ansicht), dunkelt den
   Bildschirm per SVG-Maske ab und stanzt das Zielelement frei; eine
   Sprechblase daneben erklärt den Schritt. Das Overlay ist visuell
   (pointer-events:none) -- Live-Schritte bleiben in der echten UI bedienbar.

   Etappe 2 (Login, "Ich bin ..."-Auswahl, CSV-Import) wird später an den
   passenden Positionen in "schritte" eingefügt -- diese Schritte brauchen
   die live geladene SharePoint-Datenlage und sind hier bewusst NICHT dabei.
   ========================================================================= */
const Onboarding = {
  _offen:false,
  _idx:0,
  _startIdx:0,       /* Einstiegs-Index (0 = voller Wizard, sonst Block-A-Start) */
  _cleanup:null,     /* entfernt die Reposition-Listener beim Schließen */

  _esc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); },

  /* Schritt-Definitionen. modus:"info" = zentriertes Panel ohne Ziel;
     modus:"live" = Spotlight auf ein echtes Element (ziel = CSS-Selektor).
     block:"A" = obligatorische Einrichtung (Aussperr-Schutz siehe Trigger-Logik).
     v0.28 Runde 1: Block A (Einrichtung). Der Demo-Rundgang (Block B) wird in
     Runde 2 zwischen "willkommen" und dem ersten Block-A-Schritt eingefügt. */
  schritte: [
    { id:"willkommen", modus:"info", ansicht:"start", illu:"willkommen",
      titel:"Willkommen bei SEA Praxisbesuche",
      text:"Diese kurze Einführung richtet die App für deine Arbeit ein. Sie dauert nur einen Moment – los geht’s." },
    { id:"sharepoint", modus:"live", block:"A", ansicht:"planer", tab:"einstellungen",
      ziel:"#spSyncBtn", illu:"sharepoint",
      titel:"Mit SharePoint verbinden",
      text:"Über diese Schaltfläche meldest du dich einmalig bei Microsoft an. Danach lädt die App Einrichtungen, Azubis und Einsatzpläne automatisch. Ohne Internet kannst du das später in den Einstellungen nachholen." },
    { id:"ichbin", modus:"live", block:"A", ansicht:"planer", tab:"einstellungen",
      ziel:"#bezugslehrerWert", illu:"ichbin",
      titel:"Wähle „Ich bin …“",
      text:"Wähle hier deinen Namen aus der Bezugslehrer-Liste. Das steuert die Ansicht „Nur meine Azubis“ und erscheint auf dem DFA-Formular. Die Auswahl steht nach dem ersten Import zur Verfügung." },
    { id:"privatadresse", modus:"live", block:"A", ansicht:"planer", tab:"einstellungen",
      ziel:"#obZielAdresse", illu:"adresse",
      titel:"Private Startadresse (optional)",
      text:"Optional: deine private Startadresse als Startpunkt für die Fahrtkostenberechnung. Ohne Eingabe wird die Schuladresse genutzt. Diese Angabe bleibt nur lokal auf deinem Gerät." },
    { id:"csv", modus:"live", block:"A", nurAdmin:true, ansicht:"dashboard",
      ziel:"#csvImport", illu:"csv",
      titel:"Azubis importieren",
      text:"Über diese Schaltfläche liest du einen Easysoft-Export (CSV) ein. Daraus entstehen die Azubis mit ihren Einsatzplänen. Der Import ersetzt vorhandene Einsätze, statt sie zu ergänzen. (Nur für die Administration – Bezugslehrer*innen erhalten die Azubi-Daten bereits fertig.)" },
    { id:"fertig", modus:"info", illu:"fertig",
      titel:"Fertig!",
      text:"Die Einrichtung ist abgeschlossen. Über „Einführung erneut anzeigen“ in den Einstellungen kannst du diese Tour jederzeit wiederholen." }
  ],

  /* ---- reine Logik (headless testbar) ---- */
  _istAdmin(){ return (typeof SharePoint!=="undefined") && !!SharePoint.istAdmin; },
  _sichtbar(i){ const s=this.schritte[i]; if(!s) return false; if(s.nurAdmin && !this._istAdmin()) return false; return true; },
  /* nächster sichtbarer Schritt-Index in Richtung dir (+1/-1). */
  _naechster(idx, dir){ let i=idx+dir; while(this.schritte[i] && !this._sichtbar(i)) i+=dir; return i; },
  einrichtungErledigt(){ return !!(Daten.state && Daten.state.bezugslehrerWert); },
  sollStarten(){ return !this.einrichtungErledigt(); },   /* Einrichtung offen -> Wizard anbieten */
  _blockAStart(){ let i=this.schritte.findIndex(s=>s.block==="A"); if(i<0) i=0; if(!this._sichtbar(i)) i=this._naechster(i,1); return i; },
  istErster(){ return this._naechster(this._idx,-1) < this._startIdx; },
  istLetzter(){ return this._naechster(this._idx,1) >= this.schritte.length; },
  aktiverSchritt(){ return this.schritte[this._idx]||null; },
  fortschritt(){
    /* nur tatsächlich durchlaufene, sichtbare Schritte ab Einstiegspunkt */
    return this.schritte.map((_,i)=>({ an:i===this._idx, fertig:i<this._idx, sichtbar:i>=this._startIdx && this._sichtbar(i) }))
                        .filter(p=>p.sichtbar);
  },

  /* ---- Ablaufsteuerung ---- */
  pruefeStart(){
    if(!this.sollStarten()) return;                       /* eingerichtet -> kein Auto-Start */
    if(Daten.state && !Daten.state.onboardingGesehen) this.starten();      /* Erststart: voller Wizard */
    else this.startAb(this._blockAStart());               /* Folgestart: nur die Pflicht-Einrichtung */
  },
  starten(){ this.startAb(0); },
  startAb(idx){ if(!this._sichtbar(idx)) idx=this._naechster(idx,1); this._startIdx=idx; this._idx=idx; this._offen=true; this._zeigeSchritt(true); },
  erneutAnzeigen(){
    if(Daten.state) Daten.state.onboardingGesehen=false;
    Daten.speichern(false, true);
    this.starten();
  },
  weiter(){ const n=this._naechster(this._idx,1); if(n>=this.schritte.length){ this.abschliessen(); return; } this._idx=n; this._zeigeSchritt(true); },
  zurueck(){ const p=this._naechster(this._idx,-1); if(p>=this._startIdx){ this._idx=p; this._zeigeSchritt(true); } },
  spaeterErledigen(){ this.weiter(); },   /* Block A: Schritt-Aktion später in den Einstellungen */
  /* Aussperr-Schutz: Wizard pro Sitzung schließbar OHNE die Pflicht zu tilgen.
     onboardingGesehen bleibt unverändert -> bei offener Einrichtung kommt der
     Wizard beim nächsten Start erneut (Block A). */
  beenden(){ this._schliessen(); },
  abschliessen(){
    if(Daten.state){ Daten.state.onboardingGesehen=true; Daten.speichern(false, true); }
    this._schliessen();
  },
  _schliessen(){
    this._offen=false;
    if(this._cleanup){ this._cleanup(); this._cleanup=null; }
    const o=document.getElementById("obOverlay"); if(o) o.remove();
    const b=document.getElementById("obBlase"); if(b) b.remove();
    /* SharePoint-Button wieder auf das normale (Redirect-)Verhalten zurücksetzen. */
    const spb=document.querySelector("#spSyncBtn");
    if(spb && typeof SharePoint!=="undefined") spb.onclick=()=>SharePoint.synchronisieren(true);
  },

  /* Anmeldung im Wizard: Popup (kein Reload). Bei Erfolg eine Stufe weiter;
     bei Abbruch/Fehler bleibt der Schritt, Hinweis auf „später erledigen". */
  async _sharepointAnmelden(){
    try{
      await SharePoint.synchronisierenPopup();
      if(typeof Oberflaeche!=="undefined") Oberflaeche.toast("Mit SharePoint verbunden ✓");
      this.weiter();
    }catch(e){
      if(typeof Oberflaeche!=="undefined")
        Oberflaeche.toast("Anmeldung nicht möglich – du kannst das später in den Einstellungen nachholen.", true);
    }
  },

  /* ---- Darstellung (DOM) ---- */
  _zeigeSchritt(animieren){
    const s=this.aktiverSchritt(); if(!s) return;
    let neuRendern=false;
    if(s.ansicht && Oberflaeche.ansicht!==s.ansicht){ Oberflaeche.ansicht=s.ansicht; neuRendern=true; }
    if(s.tab && Oberflaeche.tab!==s.tab){
      Oberflaeche.tab=s.tab;
      reiterMarkieren(x=>x.dataset.tab===s.tab);
      neuRendern=true;
    }
    if(neuRendern) Oberflaeche.render();
    this._zeichnen(animieren, true);   /* true = Erst-Zeichnung: Ziel einmalig in den Blick scrollen */
    /* Im SharePoint-Schritt die Anmeldung auf POPUP umleiten (kein Reload), damit
       der Wizard die Anmeldung übersteht. Nach Erfolg schaltet der Wizard weiter. */
    if(s.id==="sharepoint"){
      const spb=document.querySelector("#spSyncBtn");
      if(spb) spb.onclick=()=>this._sharepointAnmelden();
    }
    if(!this._cleanup){
      /* Reposition bei scroll/resize OHNE erneutes scrollIntoView -- sonst würde
         die Ansicht bei jedem Scrollen zum Ziel zurückspringen (Scrollen wäre blockiert). */
      const rp=()=>{ if(this._offen) this._zeichnen(false, false); };
      window.addEventListener("resize",rp);
      window.addEventListener("scroll",rp,true);
      /* Klick-Blockierung per Capture (statt pointer-events auf den Blockern):
         Klicks außerhalb von Loch + Sprechblase werden geschluckt, Scrollen (wheel/touch)
         bleibt frei. So kann nicht in die App geklickt, aber überall gescrollt werden. */
      const fang=(ev)=>{
        if(!this._offen) return;
        const bl=document.getElementById("obBlase");
        if(bl && bl.contains(ev.target)) return;              /* Sprechblase bedienbar */
        const lr=this._lochRect;
        if(lr){
          const x=ev.clientX, y=ev.clientY;
          if(x>=lr.left && x<=lr.right && y>=lr.top && y<=lr.bottom) return; /* Loch bedienbar */
        }
        ev.preventDefault(); ev.stopPropagation();
      };
      ["mousedown","mouseup","click"].forEach(t=>document.addEventListener(t,fang,true));
      this._cleanup=()=>{
        window.removeEventListener("resize",rp);
        window.removeEventListener("scroll",rp,true);
        ["mousedown","mouseup","click"].forEach(t=>document.removeEventListener(t,fang,true));
      };
    }
  },

  /* Reine Geometrie (headless testbar): beste Position der Sprechblase relativ
     zum Loch. Bevorzugt seitlich (rechts, sonst links), dann unter/über dem Loch;
     jeweils an der Querachse des Lochs zentriert. Prüft Überlappungsfreiheit und
     klemmt in den sichtbaren Viewport (visualViewport-tauglich).
     loch/blase/vp in Viewport-Koordinaten (px). */
  _blasePosition(loch, blase, vp){
    const luft=14, rand=10, bw=blase.w, bh=blase.h;
    const vpR=vp.left+vp.width, vpB=vp.top+vp.height;
    const klemmX=x=>Math.min(Math.max(vp.left+rand, x), vpR-bw-rand);
    const klemmY=y=>Math.min(Math.max(vp.top+rand, y), vpB-bh-rand);
    const mx=(loch.left+loch.right)/2, my=(loch.top+loch.bottom)/2;
    /* Kandidaten: seitlich am Loch zentriert (rechts/links), sonst darunter/darüber.
       platz = verfügbarer Raum auf dieser Seite; passt = reicht für die Blase.
       Alle vier Positionen überlappen das Loch NIE (nur möglicher Viewport-Überlauf). */
    const kandidaten=[
      { seite:"rechts", platz: vpR-loch.right,    passt: vpR-loch.right >= bw+luft+rand,    top: klemmY(my-bh/2), left: loch.right+luft },
      { seite:"links",  platz: loch.left-vp.left, passt: loch.left-vp.left >= bw+luft+rand, top: klemmY(my-bh/2), left: loch.left-bw-luft },
      { seite:"unten",  platz: vpB-loch.bottom,   passt: vpB-loch.bottom >= bh+luft+rand,   top: loch.bottom+luft, left: klemmX(mx-bw/2) },
      { seite:"oben",   platz: loch.top-vp.top,   passt: loch.top-vp.top >= bh+luft+rand,   top: loch.top-bh-luft, left: klemmX(mx-bw/2) }
    ];
    /* 1. bevorzugte Reihenfolge: erste Seite mit vollem Platz. */
    for(const k of kandidaten){ if(k.passt) return { top:k.top, left:k.left, seite:k.seite }; }
    /* 2. Notfall: Seite mit dem meisten Platz. Bis v0.42 blieb diese Position
       ungeklemmt, damit sie das Loch nicht verdeckt – auf 390 px landete die
       Blase dadurch oberhalb des Bildschirms und "Einführung schließen" war
       nicht antippbar. Eine unerreichbare Blase wiegt schwerer als ein
       verdecktes Eingabefeld, deshalb wird jetzt auch hier geklemmt. */
    const best=kandidaten.reduce((a,b)=> b.platz>a.platz ? b : a);
    return { top: klemmY(best.top), left: klemmX(best.left), seite: best.seite, knapp:true };
  },

  _zeichnen(animieren, initial){
    const s=this.aktiverSchritt(); if(!s) return;
    let ov=document.getElementById("obOverlay");
    if(!ov){ ov=document.createElement("div"); ov.id="obOverlay"; ov.className="ob-overlay"; document.body.appendChild(ov); }
    let bl=document.getElementById("obBlase");
    if(!bl){ bl=document.createElement("div"); document.body.appendChild(bl); bl.id="obBlase"; }

    let r=null;
    if(s.ziel){
      const el=document.querySelector(s.ziel);
      /* scrollIntoView nur bei der Erst-Zeichnung; danach nur noch neu berechnen. */
      if(el){ if(initial){ try{ el.scrollIntoView({block:"center"}); }catch(_){}; } r=el.getBoundingClientRect(); }
    }
    const W=window.innerWidth, H=window.innerHeight, pad=8;

    // Abdunkelung als klickblockierende Rechtecke. Bei einem Ziel bleibt nur
    // das freigestanzte Loch bedienbar (vier Blocker rundherum); ohne Ziel
    // deckt ein Vollbild-Blocker alles ab. So kann NICHT durchs Overlay in die
    // App geklickt werden -- nur das Loch (z.B. der Azubi-Eintrag) ist aktiv.
    const bloecke=[];
    const rect=(x,y,w,h)=>{ if(w>0&&h>0) bloecke.push('<div class="ob-block" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px"></div>'); };
    if(r && r.width>0 && r.height>0){
      const x=Math.max(0,r.left-pad), y=Math.max(0,r.top-pad),
            xr=Math.min(W,r.right+pad), yb=Math.min(H,r.bottom+pad);
      this._lochRect={left:x,top:y,right:xr,bottom:yb};   // für Klick-Capture
      rect(0,0,W,y);                 // oben
      rect(0,yb,W,H-yb);             // unten
      rect(0,y,x,yb-y);              // links
      rect(xr,y,W-xr,yb-y);          // rechts
      ov.innerHTML=bloecke.join("")+
        '<div class="ob-rahmen" style="left:'+x+'px;top:'+y+'px;width:'+(xr-x)+'px;height:'+(yb-y)+'px"></div>';
    } else {
      r=null;
      this._lochRect=null;
      rect(0,0,W,H);                 // Vollbild
      ov.innerHTML=bloecke.join("");
    }

    bl.className = r ? "ob-blase" : "ob-blase mitte";
    bl.innerHTML = this._blaseHtml(s);
    const b1=bl.querySelector('[data-ob="weiter"]'); if(b1) b1.onclick=()=>this.weiter();
    const b2=bl.querySelector('[data-ob="zurueck"]'); if(b2) b2.onclick=()=>this.zurueck();
    const b3=bl.querySelector('[data-ob="spaeter"]'); if(b3) b3.onclick=()=>this.spaeterErledigen();
    const b4=bl.querySelector('[data-ob="beenden"]'); if(b4) b4.onclick=()=>this.beenden();

    if(animieren) bl.style.animation="ob-fade .35s ease both"; else bl.style.animation="none";

    if(r){
      const bw=bl.offsetWidth||320, bh=bl.offsetHeight||160;
      /* Zoom-fest: gegen den tatsächlich sichtbaren Viewport klemmen. */
      const vv=window.visualViewport;
      const vp = vv ? {left:vv.offsetLeft, top:vv.offsetTop, width:vv.width, height:vv.height}
                    : {left:0, top:0, width:W, height:H};
      const pos=this._blasePosition({left:r.left,top:r.top,right:r.right,bottom:r.bottom},{w:bw,h:bh},vp);
      bl.style.top=pos.top+"px"; bl.style.left=pos.left+"px";
    } else {
      bl.style.top=""; bl.style.left="";
    }
  },

  _blaseHtml(s){
    const punkte=this.fortschritt().map(p=>'<i class="'+(p.fertig?'fertig':'')+(p.an?' an':'')+'"></i>').join("");
    const zurueckBtn=this.istErster()?"":'<button data-ob="zurueck">Zurück</button>';
    const weiterLabel=this.istLetzter()?"Fertig":(this._idx===this._startIdx?"Los geht’s":"Weiter");
    /* Block A: "später erledigen" als dezenter Ausweg pro Schritt (kein globaler Skip). */
    const spaeterLink=(s.block==="A")?'<button class="ob-skip" data-ob="spaeter">später erledigen</button>':"";
    /* Aussperr-Schutz: Einführung pro Sitzung schließbar; bei offener Einrichtung
       kommt sie beim nächsten Start erneut. */
    const beendenLink=this.istLetzter()?"":'<button class="ob-skip" data-ob="beenden">Einführung schließen</button>';
    return (s.illu?'<div class="ob-illu">'+this._illu(s.illu)+'</div>':"")+
      '<h3>'+this._esc(s.titel)+'</h3>'+
      '<p>'+this._esc(s.text)+'</p>'+
      '<div class="ob-fort">'+punkte+'</div>'+
      '<div class="ob-aktionen">'+
        '<span class="links">'+beendenLink+spaeterLink+'</span>'+
        '<span class="rechts">'+zurueckBtn+'<button class="primaer" data-ob="weiter">'+weiterLabel+'</button></span>'+
      '</div>';
  },

  /* Handgezeichnete SVG-Illustrationen, SEA-Farben, dezente CSS-Animation. */
  _illu(art){
    const NAVY="#104E64", ORANGE="#F05100", GOLD="#FCBD20", FOREST="#3E6B47";
    if(art==="willkommen") return '<svg viewBox="0 0 132 88">'+
      '<g class="anim-fade">'+
      '<rect x="34" y="20" width="64" height="52" rx="6" fill="#fff" stroke="'+NAVY+'" stroke-width="3"/>'+
      '<rect x="34" y="20" width="64" height="15" rx="6" fill="'+NAVY+'"/>'+
      '<line x1="48" y1="14" x2="48" y2="26" stroke="'+NAVY+'" stroke-width="3" stroke-linecap="round"/>'+
      '<line x1="84" y1="14" x2="84" y2="26" stroke="'+NAVY+'" stroke-width="3" stroke-linecap="round"/>'+
      '<circle cx="66" cy="52" r="12" fill="none" stroke="'+ORANGE+'" stroke-width="3"/>'+
      '<path d="M60 52 l4 4 l8 -9" fill="none" stroke="'+ORANGE+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
      '</g></svg>';
    if(art==="adresse") return '<svg viewBox="0 0 132 88">'+
      '<path class="anim-puls" d="M40 64 Q66 40 92 64" fill="none" stroke="'+GOLD+'" stroke-width="2.5" stroke-dasharray="4 5" stroke-linecap="round"/>'+
      '<g class="anim-fade"><path d="M40 64 l-9 0 l0 -14 l9 -8 l9 8 l0 14 z" fill="#fff" stroke="'+FOREST+'" stroke-width="2.5" stroke-linejoin="round"/>'+
      '<rect x="37" y="55" width="6" height="9" fill="'+FOREST+'"/></g>'+
      '<g class="anim-pop" style="animation-delay:.2s"><path d="M92 60 c0 -9 -14 -9 -14 0 c0 7 7 12 7 12 s7 -5 7 -12 z" fill="'+ORANGE+'"/>'+
      '<circle cx="85" cy="60" r="3.2" fill="#fff"/></g></svg>';
    if(art==="aufbau"){ const xs=[10,35,60,85,110]; let k="";
      xs.forEach((x,i)=>{ k+='<rect class="anim-pop" style="animation-delay:'+(i*0.12).toFixed(2)+'s" x="'+x+'" y="34" width="18" height="20" rx="3" fill="'+(i===0?ORANGE:NAVY)+'"/>'; });
      return '<svg viewBox="0 0 132 88">'+k+'</svg>'; }
    if(art==="besuch") return '<svg viewBox="0 0 132 88">'+
      '<g class="anim-fade"><rect x="38" y="22" width="56" height="48" rx="5" fill="#fff" stroke="'+NAVY+'" stroke-width="3"/>'+
      '<rect x="38" y="22" width="56" height="12" rx="5" fill="'+NAVY+'"/>'+
      '<line x1="48" y1="42" x2="84" y2="42" stroke="'+NAVY+'" stroke-width="2" opacity=".4"/>'+

const Oberflaeche = {
  ansicht:"start",          /* v0.26: "start" | "dashboard" | "planer" -- nicht persistent, Startseite bei jedem App-Start (Spec Abschnitt 4) */
  tab:"anstehend",
  einrFilter:"",            // aktueller Suchtext (Einrichtungen)
  einrOffen:new Set(),      // welche Bereich-Gruppen sind aufgeklappt
  boardAuswahl:null,        // v0.34: fuer die Zuordnung gewaehlter Azubi (id), Klick-Weg
  zoSuche:"",               // v0.40: Suche in der Zuordnungs-Spalte
  zoSort:"haus",            // v0.40: "haus" | "name"
  lkSort:"kurs",            // v0.40.1: Sortierung der aufgeklappten Azubi-Kacheln: "kurs" | "haus" | "name"
  lkOffen:new Set(),        // v0.40: aufgeklappte Lehrkraefte (ROHwert inkl. "(Zahl)")
  lehrerSuche:"",           // v0.37: Suchtext im Arbeitsbereich Bezugslehrende
  lehrerModus:"alle",       // v0.37: "alle" | "frei" | "ueberlastet" | "archiviert"
  lehrerSort:"auslastung",  // v0.37: "auslastung" (wie bisher) | "name"
  azubiAnsicht:"liste",     // "liste" | "kalender" (Umschalter im Azubi-Tab)
  kalZoom:"quartal",        // "monat" | "quartal" | "jahr"
  kalAnker:null,            // Ankerdatum (ISO); null = heutiges Fenster
  kalKurseZu:new Set(),     // zugeklappte Kursköpfe (Default: alle offen)
  init(){
    document.querySelectorAll("nav button[data-tab]").forEach(b=>{
      b.onclick=()=>{ this.tab=b.dataset.tab;
        reiterMarkieren(x=>x===b);
        this.render(); };
    });
    const fb=document.getElementById("bugBtn"); if(fb) fb.onclick=()=>this.feedbackFormular();
    /* v0.39: Klick daneben oder Esc schliesst jedes offene Aktionsmenue. Hier
       einmalig gebunden -- im Render wuerden sich die Handler stapeln. */
    document.addEventListener("click", ()=> this._aktionsMenueZu());
    document.addEventListener("keydown", (ev)=>{ if(ev.key==="Escape") this._aktionsMenueZu(); });
    this.standAnzeigen(); this.render();
    const v=document.getElementById("appVer"); if(v) v.textContent="v"+APP_VERSION;
    Onboarding.pruefeStart();   /* v0.27: Einführung beim ersten Start automatisch anbieten */
  },
  standAnzeigen(){
    const t=Daten.state&&Daten.state.aktualisiertAm;
    document.getElementById("standAnzeige").textContent = t? "Stand: "+new Date(t).toLocaleString("de-DE") : "";
  },
  toast(msg,fehler){
    const t=document.getElementById("toast"); t.textContent=msg;
    t.className="toast zeig"+(fehler?" fehler":""); clearTimeout(this._tt);
    this._tt=setTimeout(()=>t.className="toast",fehler?4500:2200);
  },
  /* v0.40: Zweite Toast-Bauform -- mit Knopf und laenger sichtbar. Ersetzt beim
     Umhaengen den frueher geplanten Bestaetigungsdialog: bei 40 Lehrkraeften
     waere das ein Dialog je Zug. toast() bleibt unveraendert; sie setzt
     textContent und raeumt das Markup hier damit von selbst wieder ab. */
  toastAktion(msg, knopfText, aufKlick){
    const t=document.getElementById("toast");
    t.innerHTML=`<span class="toast-txt"></span><button type="button" class="toast-akt"></button>`;
    t.querySelector(".toast-txt").textContent=msg;
    const knopf=t.querySelector(".toast-akt");
    knopf.textContent=knopfText;
    t.className="toast zeig mit-knopf";
    clearTimeout(this._tt);
    const zu=()=>{ t.className="toast"; t.textContent=""; };
    knopf.onclick=()=>{ zu(); aufKlick(); };
    this._tt=setTimeout(zu, 8000);
  },
  /* v0.40: EINE Azubi-Kachel -- genutzt von der Zuordnungs-Spalte und von den
     aufgeklappten Azubis einer Lehrkraft. Beide muessen gleich aussehen (Spec
     v0.40, Abschnitt 2): derselbe Azubi soll vor und nach dem Umhaengen
     unveraendert wirken.
     a = {id, name, kurs, stammeinrichtung}; attribute = zusaetzliche
     HTML-Attribute (data-*), zusatzKlasse = optionale Klasse. */
  _azubiKachelHtml(a, attribute, zusatzKlasse, farben){
    const e=s=> String(s==null?"":s).replace(/</g,"&lt;");
    /* v0.40.3: Der Farbton kommt als CSS-Variable an die Kachel, das CSS baut
       daraus Flaeche, Rahmen und Namensbalken. Ohne Kurs bleibt die Kachel weiss. */
    const h=farben ? farben.get(SPSync._norm(a.kurs||"")) : undefined;
    const klassen=(zusatzKlasse?" "+zusatzKlasse:"")+(h!==undefined?" hat-kf":"");
    const stil=h!==undefined?` style="--kf:${h}"`:"";
    return `<div class="zb-azubi${klassen}"${stil} draggable="true" ${attribute||""}>
      <span class="zb-name">${e(a.name)}</span>
      <span class="meta">${e(a.kurs||"—")}</span>
      <span class="meta zb-haus" title="Trägerhaus (Stammeinrichtung)">${e(a.stammeinrichtung||"Trägerhaus fehlt")}</span>
      ${a.wartetAuf
        ? `<span class="meta zb-wartet" title="Diese Lehrkraft ist abwesend – der Azubi kommt mit „Ist zurück“ wieder zu ihr. Bis dahin kann er auch von Hand jemand anderem zugeordnet werden.">⏸ wartet auf ${e(a.wartetAuf)}</span>`
        : a.vorher?`<span class="meta zb-vorher" title="Zuletzt zugeordnet bei dieser Lehrkraft – zum Zurückgeben dorthin ziehen">↩ vorher: ${e(a.vorher)}</span>`:""}
    </div>`;
  },
  modal(html){
    document.getElementById("modal").innerHTML=html;
    document.getElementById("modalBg").classList.add("offen");
  },
  modalZu(){ document.getElementById("modalBg").classList.remove("offen"); },

  /* v0.19: Feedback-/Bug-Meldung. Wird in state.meldungen[] gespeichert und beim Export automatisch
     mit in die JSON geschrieben – das Dashboard kann die Meldungen aller Kolleg:innen anzeigen. */
  feedbackFormular(){
    const kats=[["fehler","Fehler"],["wunsch","Wunsch"],["frage","Frage"]];
    const segs=kats.map((k,i)=>`<label class="seg"><input type="radio" name="fbKat" value="${k[0]}" ${i===0?"checked":""}> ${k[1]}</label>`).join("");
    const wer=bezugslehrerAnzeige(Daten.state.bezugslehrerWert)||"";
    const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    this.modal(`<h3>Feedback an Christian</h3>
      <div class="meta" style="margin-bottom:10px">Deine Meldung wird lokal auf diesem Gerät gespeichert. Kein automatischer Versand.</div>
      <div class="feld"><label>Art</label><div class="seg-reihe">${segs}</div></div>
      <div class="feld"><label>Beschreibung</label>
        <textarea id="fbText" rows="4" placeholder="Was ist passiert bzw. was wünschst du dir?" style="font:inherit;padding:6px 8px;border:1px solid var(--rahmen);border-radius:6px;resize:vertical"></textarea></div>
      <div class="meta">Absender: <b>${wer?esc(wer):"(noch keine Bezugslehrer-Auswahl in den Einstellungen getroffen)"}</b></div>
      <div class="modal-aktionen">
        <button onclick="Oberflaeche.modalZu()">Abbrechen</button>
        <button class="primaer" id="fbSenden">Melden</button>
      </div>`);
    document.getElementById("fbSenden").onclick=async()=>{
      const text=document.getElementById("fbText").value.trim();
      if(!text){ this.toast("Bitte eine Beschreibung eingeben.",true); return; }
      const kat=(document.querySelector('input[name=fbKat]:checked')||{}).value||"fehler";
      Daten.state.meldungen = Daten.state.meldungen || [];
      Daten.state.meldungen.push({
        id:"m-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6),
        zeit:new Date().toISOString(), von:bezugslehrerAnzeige(Daten.state.bezugslehrerWert)||"", version:APP_VERSION,
        tab:this.tab||"", kategorie:kat, text:text
      });
      await Daten.speichern("Feedback gespeichert", true);
      this.modalZu();
      this.toast("Danke für dein Feedback.");
    };
  },

  /* v0.26: Wechsel Startseite / Dashboard / Planer. Kein zusaetzlicher
     Graph-API-Call beim Wechsel -- alle Ansichten lesen aus demselben,
     einmal beim Login geladenen Zustand (Spec Abschnitt 7). */
  ansichtWechseln(z){
    this.ansicht = (z==="dashboard"||z==="planer") ? z : "start";
    this.render();
  },
  render(){
    const el=document.getElementById("inhalt");
    const nav=document.querySelector("nav");
    if(this.ansicht!=="planer"){                       /* v0.26: Start/Dashboard ohne Tab-Leiste */
      if(nav) nav.style.display="none";
      el.innerHTML = this.ansicht==="dashboard" ? this.viewDashboard() : this.viewStart();
      // v0.32.1: Auch das Dashboard braucht _verdrahten() -- der CSV-Import-Button
      // (und kuenftige Verwaltungs-Buttons) lebt dort. Vorher lief _verdrahten() nur
      // fuer die "planer"-Ansicht, der Dashboard-Button blieb funktionslos.
      if(this.ansicht==="dashboard") this._verdrahten();
      return;
    }
    if(nav) nav.style.display="";
    let html;
    if(this.tab==="anstehend") html=this.viewAnstehend();
    else if(this.tab==="azubis") html=this.viewAzubis();
    else if(this.tab==="einrichtungen") html=this.viewEinrichtungen();
    else if(this.tab==="touren") html=this.viewTouren();
    else html=this.viewEinstellungen();
    el.innerHTML=html;
    this._verdrahten();
    if(this.tab==="touren") this._tourenInit();
  },

  /* ---- v0.26: Startseite ---- */
  viewStart(){
    const wer=bezugslehrerAnzeige(Daten.state.bezugslehrerWert)||"";
    return `<div class="spalte" style="grid-column:1/-1">
      <h2>Willkommen${wer?", "+wer.replace(/</g,"&lt;"):""}</h2>
      <div class="meta">Womit möchtest du arbeiten?</div>
      <!-- Platz für News-Feed, siehe SPEC_SEA-Dashboard_Plan.md Abschnitt 2 -->
      <div class="start-kacheln">
        <button class="kachel" onclick="Oberflaeche.ansichtWechseln('dashboard')">
          <span class="kachel-ico">📊</span>
          <span class="kachel-titel">Dashboard</span>
          <span class="kachel-text">Praxisbesuche im Überblick und Auslastung der Bezugslehrenden (Ist / Soll).</span>
        </button>
        <button class="kachel" onclick="Oberflaeche.ansichtWechseln('planer')">
          <span class="kachel-ico">🗓️</span>
          <span class="kachel-titel">Praxisbesuchsplaner</span>
          <span class="kachel-text">Azubis, anstehende Besuche, Kalender, Touren, DFA und Einstellungen.</span>
        </button>
      </div></div>`;
  },

  /* ---- v0.26/v0.37: Dashboard. Ignoriert bewusst den "Nur meine/Alle"-
     Umschalter -- zeigt immer ALLE Bezugslehrer (Spec Abschnitt 6, letzter
     Punkt). Aufbau seit v0.39.1: Kopfzeile (Zurück + CSV-Import) -> Kennzahlen
     -> Bezugslehrende. Der CSV-Import steht rechtsbündig ganz oben, weil er
     sonst hinter der 40-zeiligen Lehrkraft-Tabelle läge. ---- */
  viewDashboard(){
    /* CSV-Import ist eine Admin-Funktion (Azubi-Daten sind für Bezugslehrer bereits
       geladen). Der Button lebt daher hier im Dashboard, nur für Admins sichtbar.
       v0.39.1: steht jetzt rechtsbündig in der Kopfzeile neben "Zurück" -- der
       frühere eigene Verwaltungs-Abschnitt enthielt sonst nur noch eine
       Überschrift ohne weiteren Inhalt. */
    const admin=Dashboard.darfVerwalten();
    const kopfzeile=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button onclick="Oberflaeche.ansichtWechseln('start')">← Zurück zur Startseite</button>
        ${admin?`<button class="aktion" id="csvImport">CSV importieren</button>`:""}
      </div>`;
    const badge=admin ? `<span class="rollen-badge admin">Verwaltung</span>`
                      : `<span class="rollen-badge">Nur-Lese-Ansicht</span>`;
    const verwaltung = admin
      ? ""
      : `<section class="einst-block">
          <div class="meta">🔒 Verwaltungsfunktionen (Importe, Anlegen, Genehmigungen) sind Administrator:innen vorbehalten. Diese Ansicht ist für dich nur lesend.</div>
        </section>`;
    /* Etappe 1: Besuchs-Kennzahlen (schulweit, read-only für alle). Erklärungen
       ausschliesslich per title-Hover (ⓘ auf der Überschrift + je Kachel). */
    const bu=Dashboard.besuchsUebersicht(Azubis.alle());
    /* v0.37: Kachel "ohne Zuordnung" nur für Admins -- nur sie können etwas dagegen
       tun. Sie ersetzt die frühere Dauer-Sichtbarkeit des Boards (v0.36.1): die
       offene Arbeit meldet sich jetzt ganz oben, statt sich in einer Liste zu verstecken. */
    const ohneZuo = admin ? Azubis.ohneBezugslehrer().length : 0;
    const kachelOhne = admin
      ? `<div class="kpi klickbar${ohneZuo?" kpi-gold":""}" id="kpiOhneZuordnung" title="Azubis ohne Bezugslehrer*in – z.B. frisch per CSV angelegt. Klick springt zum Zuordnen.">
          <span class="kpi-zahl">${ohneZuo}</span><span class="kpi-label">ohne Zuordnung</span></div>`
      : "";
    const kacheln=`<section class="einst-block">
      <h2>Praxisbesuche im Überblick <span class="einst-info" title="Schulweit über alle geladenen Azubis. Gezählt werden einzelne Pflichtbesuch-Einträge nach ihrem Status – nicht nach Besuchstyp zusammengefasst wie in der Anstehend-Liste. Die Zahlen können daher leicht von „Anstehend“ abweichen.">i</span></h2>
      <div class="kpi-reihe">
        <div class="kpi" title="Alle Pflichtbesuch-Einträge über alle Azubis (Summe aller Status – auch offen und vorläufig).">
          <span class="kpi-zahl">${bu.gesamt}</span><span class="kpi-label">Pflichtbesuche gesamt</span></div>
        <div class="kpi kpi-forest" title="Besuche mit Status „durchgeführt“ – bereits erledigt.">
          <span class="kpi-zahl">${bu.durchgeführt}</span><span class="kpi-label">durchgeführt</span></div>
        <div class="kpi kpi-navy" title="Besuche mit Status „geplant“ – Termin steht, aber noch nicht durchgeführt.">
          <span class="kpi-zahl">${bu.geplant}</span><span class="kpi-label">geplant</span></div>
        <div class="kpi kpi-danger" title="Besuche mit Status „nachzuholen“ – Termin verpasst, muss neu angesetzt werden.">
          <span class="kpi-zahl">${bu.nachzuholen}</span><span class="kpi-label">nachzuholen</span></div>
        ${kachelOhne}
      </div>
    </section>`;
    return `<div class="spalte" style="grid-column:1/-1">
      ${kopfzeile}
      <div style="margin-bottom:10px"><b style="font-size:17px;color:var(--navy)">Dashboard</b>${badge}</div>
      ${verwaltung}
      ${kacheln}
      ${this.viewBezugslehrende()}
    </div>`;
  },

  /* ---- v0.37: Arbeitsbereich "Bezugslehrende" ---------------------------
     Loest die drei frueheren Abschnitte ab, die dieselbe Lehrkraft dreifach
     gefuehrt haben: Zuordnungs-Board (v0.34), Bezugslehrer-Verwaltung (v0.35)
     und Bezugslehrer-Auslastung (v0.26). Jetzt gilt: eine Lehrkraft = eine
     Zeile, die Auslastung, Stammdaten und Aktionen traegt -- und zugleich
     Ziel der Zuordnung ist (Klick oder Drag-and-Drop).
     Nicht-Admins sehen dieselbe Tabelle rein lesend: ohne Zuordnungs-Leiste,
     ohne Aktionsspalte, ohne "Neue Lehrkraft" (Rollenmodell der Dashboard-Spec). */
  viewBezugslehrende(){
    const admin=Dashboard.darfVerwalten();
    const sel=this.boardAuswahl;
    /* v0.40.3: einmal fuer beide Spalten -- derselbe Kurs muss links wie rechts
       denselben Ton tragen, sonst gruppiert die Farbe nicht, sondern verwirrt. */
    const farben=Dashboard.kursFarben(Azubis.alle());
    /* Zuordnungs-Spalte: die unzugeordneten Azubis als Kacheln LINKS. Ab 1200px
       zweispaltig neben der Tabelle, darunter wieder als Leiste quer oben. */
    let spalte="";
    if(admin){
      const offen=Dashboard.offeneAzubis(Azubis.alle(), Daten.state.azubiNamen,
                                         {suche:this.zoSuche, sortierung:this.zoSort});
      const gesamt=Azubis.ohneBezugslehrer().length;
      /* v0.38: Traegerhaus mit auf den Chip -- es entscheidet mit, zu wem der
         Azubi passt (siehe Schwerpunkt-Spalte der Tabelle). */
      const chips=offen.map(a=>
        this._azubiKachelHtml(a, `data-zb-azubi="${a.id}"`, sel===a.id?"gewaehlt":"", farben)).join("");
      const werkzeug=gesamt?`<div class="zo-werkzeug">
          <input type="search" id="zoSuche" placeholder="Name oder Kurs…" value="${String(this.zoSuche||"").replace(/"/g,"&quot;")}">
          <div class="seg-knopf" id="zoSortUms">
            <button data-zosort="haus" class="${this.zoSort==="haus"?"an":""}" title="Azubis eines Trägerhauses stehen zusammen">nach Haus</button>
            <button data-zosort="name" class="${this.zoSort==="name"?"an":""}">nach Name</button>
          </div>
        </div>`:"";
      const kopf = gesamt
        ? `Ohne Zuordnung (${gesamt}) <span class="meta">– ${sel?"jetzt eine Lehrkraft anklicken":"Azubi anklicken oder auf eine Zeile ziehen"}</span>`
        : `Alle Azubis sind zugeordnet ✓ <span class="meta">– neu importierte Azubis erscheinen hier</span>`;
      const leer = (gesamt && !offen.length)
        ? `<div class="meta">Kein Treffer für die Suche.</div>` : "";
      spalte=`<div class="zo-leiste zo-spalte" id="zoSpalte">
          <div class="zo-kopf">${kopf}</div>
          ${werkzeug}${leer}
          <div class="zo-chips">${chips}</div>
          <div class="zo-ablage">↩ Hierher ziehen: Zuordnung aufheben</div>
        </div>`;
    }
    const filter=`<div class="seg-knopf" id="lehrerFilterUms">
        <button data-lmodus="alle" class="${this.lehrerModus==="alle"?"an":""}">Alle</button>
        <button data-lmodus="frei" class="${this.lehrerModus==="frei"?"an":""}" title="Nur Lehrkräfte mit noch freier Kapazität">Freie Kapazität</button>
        <button data-lmodus="ueberlastet" class="${this.lehrerModus==="ueberlastet"?"an":""}" title="Über der Kapazität (rote Ampel)">Überlastet</button>
        <button data-lmodus="archiviert" class="${this.lehrerModus==="archiviert"?"an":""}">Archivierte</button>
      </div>`;
    const sortUms=`<div class="seg-knopf" id="lehrerSortUms">
        <button data-lsort="auslastung" class="${this.lehrerSort==="auslastung"?"an":""}">nach Auslastung</button>
        <button data-lsort="name" class="${this.lehrerSort==="name"?"an":""}">nach Name</button>
      </div>`;
    const kachelUms=admin?`<div class="seg-knopf" id="lkSortUms" title="Reihenfolge der aufgeklappten Azubi-Kacheln">
        <button data-lksort="kurs" class="${this.lkSort==="kurs"?"an":""}">Kacheln: Kurs</button>
        <button data-lksort="haus" class="${this.lkSort==="haus"?"an":""}">Haus</button>
        <button data-lksort="name" class="${this.lkSort==="name"?"an":""}">Name</button>
      </div>`:"";
    const rechts=`<div class="zo-rechts">
      <div class="werkzeug">
        <input type="search" id="lehrerSuche" placeholder="Lehrkraft oder Trägerhaus suchen…" value="${String(this.lehrerSuche||"").replace(/"/g,"&quot;")}">
        ${filter}${sortUms}${kachelUms}
        ${admin?`<button class="primaer" id="lehrerNeu">＋ Neue Lehrkraft</button>`:""}
      </div>
      <div id="lehrerTabelle">${this._lehrerTabelleHtml()}</div>
    </div>`;
    /* v0.40.2: stehender Hinweis, wenn ein Schreibvorgang nur halb gelungen ist.
       Nur fuer Admins -- nur sie schreiben hier, und nur sie koennen die Spalte
       richtigstellen. Steht ueber den Spalten, damit er nicht im Scrollbereich
       untergeht. */
    const defekt = admin ? Dashboard.schreibDefektMeldung(Daten.state) : null;
    /* Der Text kommt aus festen Konstanten -- escapen ist reine Vorsorge, falls
       je ein Feldname aus SharePoint hier landet. Gleiches Mittel wie in
       _azubiKachelHtml (dort ebenfalls lokal). */
    const esc = s => String(s==null?"":s).replace(/</g,"&lt;");
    const defektHtml = defekt
      ? `<div class="hinweis" id="schreibDefekt">⚠ ${esc(defekt)}</div>` : "";
    return `<section class="einst-block" id="bereichBezugslehrende">
      <h2>Bezugslehrende <span class="einst-info" title="Eine Zeile je Lehrkraft. Ist = aktuell zugeordnete Azubis, Soll = Kapazität aus der SharePoint-Liste „Bezugslehrende“ (ersatzweise die „(Zahl)“ am Namen, solange die Liste jemanden nicht kennt). Trägerhaus (Schwerpunkt) = das Haus, aus dem die meisten ihrer Azubis kommen.">i</span></h2>
      ${defektHtml}
      <div class="${admin?"zo-zweispaltig":""}">${spalte}${rechts}</div>
    </section>`;
  },

  /* Tabellenteil des Arbeitsbereichs -- eigene Funktion, weil die Suche nur
     diesen Teil neu zeichnet (siehe _lehrerTabelleRender). */
  _lehrerTabelleHtml(){
    const admin=Dashboard.darfVerwalten();
    /* v0.41: Der Vertretungsname kommt aus SharePoint -- hier ist Escapen nicht
       Vorsorge wie in der Funktion darueber, sondern noetig. */
    const esc = s => String(s==null?"":s).replace(/</g,"&lt;");
    const alle=Dashboard.lehrkraftZeilen(Azubis.alle());
    if(!alle.length) return `<div class="leer">Noch keine Azubis geladen. Bitte im Praxisbesuchsplaner unter „Einstellungen" bei SharePoint anmelden bzw. synchronisieren.</div>`;
    const zeilen=Dashboard.lehrkraftFiltern(alle,{suche:this.lehrerSuche, modus:this.lehrerModus, sortierung:this.lehrerSort});
    if(!zeilen.length) return `<div class="leer">Keine Lehrkraft passt zu Suche und Filter.</div>`;
    const waehlt=admin && !!this.boardAuswahl;
    /* einmal fuer die ganze Tabelle: welche Azubis haengen an wem? */
    const proLehrkraft = admin ? Dashboard.azubisJeLehrkraft(Azubis.alle(), Daten.state.azubiNamen, {sortierung:this.lkSort}) : new Map();
    const farben = Dashboard.kursFarben(Azubis.alle());
    const rows=zeilen.map(z=>{
      const pz=z.quote!==null?Math.round(z.quote*100):null;
      const farbe=z.ampel==="rot"?"var(--danger)":z.ampel==="gelb"?"var(--gold)":"var(--forest)";
      const ausl=z.quote!==null
        ? `<span class="ampel ${z.ampel}"></span>${pz}\u00a0%<div class="ausl-balken"><i style="width:${Math.min(100,pz)}%;background:${farbe}"></i></div>`
        : `<span class="meta">Kapazität nicht hinterlegt</span>`;
      /* Ueberbuchen bleibt moeglich -- es soll nur nicht unbemerkt passieren.
         Wann gedimmt wird, entscheidet das CSS (Klick-Modus oder Ziehen).
         v0.41: Abwesende werden genauso gedimmt. Dieselbe Klasse, weil es
         dieselbe Aussage ist ("hier eher nicht") und Zuordnen in beiden
         Faellen moeglich bleibt -- bewusstes Ueberstimmen. */
      const gedimmt = z.abwesend || (z.frei!=null && z.frei<=0);
      /* inListe=false: Lehrkraft existiert nur als Text an den Azubis (Drift-Punkt 2
         der Datenarchitektur). Sichtbar machen statt verstecken -- ohne spId gibt es
         nichts zu bearbeiten. */
      /* v0.41: Reihenfolge ist Absicht -- archiviert schlaegt abwesend. Wer
         ausgeschieden ist, ist nicht "abwesend, vertreten durch X"; die beiden
         Zustaende sind unabhaengig, aber nur einer passt in eine Pille. */
      const status = !z.inListe
        ? `<span class="pill warn" title="Steht nur als Text an den Azubis, nicht in der Liste „Bezugslehrende“ – daher nicht bearbeitbar.">nicht in Stammliste</span>`
        : !z.aktiv   ? `<span class="pill warn">archiviert</span>`
        : z.abwesend ? `<span class="pill abwesend">${esc(Dashboard.abwesenheitsText(z))}</span>`
        :              `<span class="pill">aktiv</span>`;
      const aktionen = admin
        ? this._aktionsMenueHtml(Dashboard.lehrkraftAktionen(z), z.spId)
        : "";
      /* v0.38: Schwerpunkt-Trägerhaus. "5 / 7" heisst: 5 der 7 Azubis dieser Lehrkraft
         kommen aus diesem Haus. Details (weitere Häuser, fehlende Angaben) im Hover. */
      const e=z.einrichtung;
      const haus = !e
        ? `<span class="meta">—</span>`
        : `${e.name.replace(/</g,"&lt;")} <span class="meta" title="${e.anzahl} von ${e.gesamt} Azubis dieser Lehrkraft kommen aus diesem Haus${e.verschiedene>1?" · insgesamt "+e.verschiedene+" verschiedene Häuser":""}${e.ohne?" · "+e.ohne+" ohne Angabe":""}">${e.anzahl} / ${e.gesamt}</span>`;
      /* Schluessel ist der ROHwert (wie in proLehrkraft/azubisJeLehrkraft) --
         nicht normalisiert, sonst zeigen zwei "(Zahl)"-Varianten derselben
         Person dieselbe zusammengefuehrte Kachel-Liste statt ihrer eigenen. */
      const key=String(z.wert);
      const meine=proLehrkraft.get(key)||[];
      const offen=this.lkOffen.has(key);
      const chevron = (admin && meine.length)
        ? `<button class="lk-chevron${offen?" offen":""}" data-lk-auf="${key.replace(/"/g,"&quot;")}" title="Zugeordnete Azubis anzeigen" aria-label="Zugeordnete Azubis anzeigen"><span class="chevron">▸</span></button>`
        : "";
      /* v0.40 Fix 1: dieselbe Lehrkraft-Kennung wie die lk-zeile -- die Kachel-Zeile
         ist im DOM ein GESCHWISTER der lk-zeile (kein <tr> in <tr> moeglich), sonst
         erreicht ein Drop dort keinen Handler und der Browser laesst ihn gar nicht
         erst zu. So greift die Verdrahtung in _lehrerZeilenVerdrahten unveraendert. */
      const kacheln = (admin && offen && meine.length)
        ? `<tr class="lk-azubis" data-zb-lehrer="${String(z.wert).replace(/"/g,"&quot;")}"><td colspan="8"><div class="lk-kacheln">${meine.map(m=>
             this._azubiKachelHtml(m, `data-lk-azubi="${m.id}"`, "", farben)
           ).join("")}</div></td></tr>`
        : "";
      return `<tr class="lk-zeile${gedimmt?" lk-voll":""}"${admin?` data-zb-lehrer="${String(z.wert).replace(/"/g,"&quot;")}"`:""}>
        ${admin?`<td class="lk-auf">${chevron}</td>`:""}
        <td>${z.name.replace(/</g,"&lt;")}</td>
        <td>${z.stellenumfang!=null?z.stellenumfang+"\u00a0%":`<span class="meta">—</span>`}</td>
        <td>${z.ist}${z.soll!==null?" / "+z.soll:""}</td>
        <td>${ausl}</td>
        <td>${haus}</td>
        <td>${status}</td>
        ${admin?`<td class="lk-aktion">${aktionen}</td>`:""}
      </tr>${kacheln}`;
    }).join("");
    const hinweis = waehlt ? `<div class="hinweis">Azubi gewählt – jetzt die Zeile der gewünschten Lehrkraft anklicken.</div>` : "";
    /* v0.39.1: Solange ein Azubi gewählt ist, bleibt der Zuordnungs-Modus auch beim
       Scrollen sichtbar -- am Mauszeiger, nicht nur am (dann weggescrollten) Hinweis. */
    return `${hinweis}<div class="meta" style="margin-bottom:8px">${zeilen.length} von ${alle.length} Lehrkräften</div>
      <table${waehlt?' class="zuordnen-aktiv"':""}><thead><tr>${admin?"<th></th>":""}<th>Name</th><th>Stelle</th><th>Azubis (Ist / Soll)</th><th>Auslastung</th><th>Trägerhaus (Schwerpunkt)</th><th>Status</th>${admin?"<th></th>":""}</tr></thead>
      <tbody>${rows}</tbody></table>`;
  },

  /* ---- v0.39: Aktionsmenü (⋮) ------------------------------------------
     Buendelt Zeilen-Aktionen, statt jede als eigenen Knopf zu zeigen.
     Genutzt von Bezugslehrenden und Einrichtungen; die Punkte kommen aus
     Dashboard (dort testbar), hier wird nur gezeichnet und verdrahtet. */
  _aktionsMenueHtml(punkte, schluessel){
    if(!punkte || !punkte.length) return "";
    const s=String(schluessel).replace(/"/g,"&quot;");
    const eintraege=punkte.map(p=>
      `<button data-mp="${p.id}"${p.gefahr?' class="gefahr"':''}>${p.label}</button>`).join("");
    return `<div class="akt-menue">
        <button class="akt-knopf" data-menue="${s}" title="Aktionen" aria-label="Aktionen">⋮</button>
        <div class="akt-liste" data-menue-liste="${s}" hidden>${eintraege}</div>
      </div>`;
  },
  /* Schliesst jedes offene Menue. Bewusst global: es soll immer hoechstens eines
     offen sein, auch ueber verschiedene Tabellen hinweg. */
  _aktionsMenueZu(){
    document.querySelectorAll("[data-menue-liste]").forEach(l=> l.hidden=true);
  },
  _aktionsMenueVerdrahten(wurzelSelektor, aufPunkt){
    const wurzel=document.querySelector(wurzelSelektor);
    if(!wurzel) return;
    wurzel.querySelectorAll("[data-menue]").forEach(k=>{
      k.onclick=(ev)=>{
        /* stopPropagation: die Lehrkraft-Zeile ist selbst Zuordnungs-Ziel --
           ohne das wuerde das Oeffnen des Menues zusaetzlich zuordnen. */
        ev.stopPropagation();
        const liste=k.parentNode.querySelector("[data-menue-liste]");
        const warZu=liste && liste.hidden;
        this._aktionsMenueZu();
        if(liste) liste.hidden=!warZu;
      };
    });
    wurzel.querySelectorAll("[data-menue-liste]").forEach(l=>{
      /* stopPropagation: die Liste hat Innenabstand -- ein Klick daneben (noch
         in der Liste, neben den Knoepfen) darf nicht zur Zeile durchlaufen. */
      l.onclick=(ev)=> ev.stopPropagation();
      l.querySelectorAll("[data-mp]").forEach(b=>{
        b.onclick=(ev)=>{ ev.stopPropagation(); this._aktionsMenueZu();
                          aufPunkt(b.dataset.mp, l.dataset.menueListe); };
      });
    });
  },

  /* Teil-Neuzeichnung: nur die Tabelle. Ein volles render() bei jedem Tastendruck
     wuerde den Fokus aus dem Suchfeld reissen -- gleiches Muster wie bei den
     Einrichtungen (_einrGruppenRender / einrSuche). */
  _lehrerTabelleRender(){
    const el=document.getElementById("lehrerTabelle");
    if(!el) return;
    el.innerHTML=this._lehrerTabelleHtml();
    this._lehrerZeilenVerdrahten();
  },

  _ziehtAzubi:null,          // v0.40: id des gerade gezogenen Azubis (aus einer Zeile)
  _asHandler:null,           // v0.40: Auto-Scroll-Handler waehrend des Ziehens

  /* v0.40: Ein Ziehvorgang beginnt/endet. herkunft = "spalte" | "zeile" --
     nur eine Kachel AUS einer Zeile darf in der Spalte abgelegt werden
     (ein Chip aus der Spalte auf die Spalte waere ein Nichts-Zug). */
  _ziehenAn(id, herkunft){
    this._ziehtAzubi = (herkunft==="zeile") ? id : null;
    const t=document.getElementById("lehrerTabelle");
    if(t) t.classList.add("zieht");
    // v0.40.1: Ablageflaeche in der Spalte nur bei Herkunft "zeile" -- ein Chip
    // aus der Spalte kann dort nicht abgelegt werden. Klasse haengt am body,
    // weil die Flaeche ausserhalb von #lehrerTabelle liegt.
    if(herkunft==="zeile") document.body.classList.add("zieht-zeile");
    this._autoScrollAn();
  },
  _ziehenAus(){
    this._ziehtAzubi=null;
    const t=document.getElementById("lehrerTabelle");
    if(t) t.classList.remove("zieht");
    document.body.classList.remove("zieht-zeile");
    this._autoScrollAus();
  },

  /* v0.40: Am oberen/unteren Fensterrand scrollt die Seite von selbst weiter.
     Ohne das ist ein Ziel 30 Zeilen tiefer nicht erreichbar -- bei gedrueckter
     Maustaste laesst sich weder scrollen noch suchen, und "vorher filtern" hilft
     nicht: dann verschwindet die Quell-Zeile samt Kacheln. */
  _autoScrollAn(){
    if(this._asHandler) return;
    const rand=60, schritt=14;
    this._asHandler=(ev)=>{
      const y=ev.clientY;
      if(y<rand) window.scrollBy(0,-schritt);
      else if(y>window.innerHeight-rand) window.scrollBy(0,schritt);
    };
    document.addEventListener("dragover", this._asHandler);
  },
  _autoScrollAus(){
    if(!this._asHandler) return;
    document.removeEventListener("dragover", this._asHandler);
    this._asHandler=null;
  },

  /* v0.40: EIN Weg fuer alle drei Handgriffe -- zuordnen, umhaengen, entfernen,
     egal ob per Klick oder per Ziehen. Statt einer Rueckfrage VOR dem Schreiben
     gibt es die Meldung mit "Rueckgaengig" DANACH (Spec v0.40, Abschnitt 4).
     Die Kapazitaets-Aussage wird VOR dem Schreiben berechnet -- danach ist der
     Azubi schon mitgezaehlt. */
  _zuordnungLaeuft:false,    // v0.40: Riegel gegen ueberlappende Handgriffe
  async _zuordnungAendern(id, wert){
    if(id==null || wert==null) return;
    /* Zwei Handgriffe kurz hintereinander wuerden parallel schreiben. Kaemen die
       PATCHes vertauscht an, stuende in SharePoint ein anderer Wert als lokal --
       und weil blOffen=false gesetzt wurde, wird das nie nachgereicht. */
    if(this._zuordnungLaeuft) return;
    this._zuordnungLaeuft=true;
    try{
      /* v0.40: sicher beenden -- nach dem folgenden render() ist das gezogene
         Element weg und ondragend feuert nicht mehr. */
      this._ziehenAus();
      const azubi=Azubis.alle().find(a=>String(a.id)===String(id));
      if(!azubi) return;
      const vorher=azubi.bezugslehrer||"";
      const kap = wert ? Dashboard.ueberbuchtNach(Dashboard.lehrkraftZeilen(Azubis.alle()), wert) : null;
      const azubiName=Azubis.name(azubi.id)||azubi.kuerzel||"Azubi";
      this.boardAuswahl=null;
      /* stumm=true: die eigene Sync-Warnung von _bezugslehrerSchreiben unterdruecken
         -- sie wuerde sonst den Rueckgaengig-Toast sofort wieder ueberschreiben.
         a.blOffen danach lesen (nicht vorher -- steht erst nach dem Senden fest)
         und, falls das Senden scheiterte, in dieselbe Meldung haengen. */
      const davor=await Azubis.bezugslehrerUmhaengen(azubi.id, wert, true);
      if(!davor) return;                       /* unveraendert -- keine Meldung */
      /* v0.40.2: auch der halbe Erfolg kommt hier an (Zuordnung ja, Vorgaenger nein). */
      const sync=Dashboard.schreibHinweis(azubi);
      this.toastAktion(
        Dashboard.umhaengenMeldung(azubiName, bezugslehrerAnzeige(vorher), bezugslehrerAnzeige(wert), kap)+sync,
        "Rückgängig",
        ()=> Azubis.bezugslehrerZustandHerstellen(davor));
    } finally { this._zuordnungLaeuft=false; }
  },
  /* Handler der Lehrkraft-Zeilen: Zuordnen (Klick/Drop) + Bearbeiten/Loeschen.
     Eigene Funktion, weil die Tabelle auch ohne vollen Render neu entsteht. */
  _lehrerZeilenVerdrahten(){
    this._aktionsMenueVerdrahten("#lehrerTabelle", (punkt, spId)=>{
      if(punkt==="edit")   this.lehrerFormular(Bezugslehrer.alle().find(l=>String(l.spId)===String(spId)));
      if(punkt==="archiv") this.lehrerArchivKlick(spId);
      if(punkt==="abwesend") this.lehrerAbwesendKlick(spId);
      if(punkt==="zurueck")  this.lehrerZurueckKlick(spId);
      if(punkt==="del")    this.lehrerLoeschenKlick(spId);
    });
    document.querySelectorAll("[data-zb-lehrer]").forEach(z=>{
      z.onclick=()=>{ if(this.boardAuswahl) this._zuordnungAendern(this.boardAuswahl, z.dataset.zbLehrer); };
      z.ondragover=(ev)=>{ ev.preventDefault(); z.classList.add("zb-ueber"); };
      z.ondragleave=()=>z.classList.remove("zb-ueber");
      z.ondrop=(ev)=>{ ev.preventDefault(); z.classList.remove("zb-ueber");
                       this._zuordnungAendern(ev.dataTransfer.getData("text/plain"), z.dataset.zbLehrer); };
    });
    document.querySelectorAll("[data-lk-auf]").forEach(b=>{
      /* stopPropagation: die Zeile ist Zuordnungs-Ziel -- ohne das wuerde das
         Aufklappen bei gewaehltem Azubi zusaetzlich zuordnen. Dieselbe Falle
         wie beim Aktionsmenue in v0.39. */
      b.onclick=(ev)=>{ ev.stopPropagation();
        const k=b.dataset.lkAuf;
        if(this.lkOffen.has(k)) this.lkOffen.delete(k); else this.lkOffen.add(k);
        this._lehrerTabelleRender(); };
    });
    document.querySelectorAll("[data-lk-azubi]").forEach(k=>{
      /* stopPropagation: seit Fix 1 ist die Kachel-Zeile selbst Zuordnungs-Ziel --
         ein Klick auf die Kachel soll aber nichts tun (Vorgabe: Klick != Ziehen laesst
         sich bei Kacheln kaum unterscheiden). Dieselbe Falle wie beim Chevron/Aktionsmenue. */
      k.onclick=(ev)=> ev.stopPropagation();
      k.ondragstart=(ev)=>{ ev.dataTransfer.setData("text/plain", k.dataset.lkAzubi);
                            ev.dataTransfer.effectAllowed="move";
                            this._ziehenAn(k.dataset.lkAzubi, "zeile"); };
      k.ondragend=()=> this._ziehenAus();
    });
    const spalte=document.getElementById("zoSpalte");
    if(spalte){
      spalte.ondragover=(ev)=>{ if(!this._ziehtAzubi) return;   /* Chip aus der Spalte: kein Ziel */
                                ev.preventDefault(); spalte.classList.add("zb-ueber"); };
      spalte.ondragleave=()=> spalte.classList.remove("zb-ueber");
      spalte.ondrop=(ev)=>{ ev.preventDefault(); spalte.classList.remove("zb-ueber");
                            if(!this._ziehtAzubi) return;
                            this._zuordnungAendern(ev.dataTransfer.getData("text/plain"), ""); };
    }
  },
  /* Dialog Bezugslehrer anlegen ODER bearbeiten. Mit Objekt l = bearbeiten (inkl.
     Aktiv/Archivieren), ohne = neu. Kapazität wird aus dem Stellenumfang vorgeschlagen
     (100 % = 25), bleibt überschreibbar; bei "bearbeiten" wird eine vorhandene Kapazität
     nicht automatisch überschrieben. */
  lehrerFormular(l){
    const bearb=!!(l && l.spId!=null);
    const esc=v=>String(v==null?"":v).replace(/"/g,'&quot;');
    this.modal(`<h3>${bearb?"Bezugslehrer bearbeiten":"Neuer Bezugslehrer"}</h3>
      <div class="feld"><label>Name (Nachname, Vorname)</label><input id="lfName" value="${bearb?esc(l.name):""}" placeholder="Muster, Alex"></div>
      <div class="feld-reihe">
        <div class="feld"><label>Stellenumfang %</label><input id="lfStelle" type="number" min="0" max="200" step="5" value="${bearb?(l.stellenumfang!=null?l.stellenumfang:""):100}"></div>
        <div class="feld"><label>Kapazität (Azubis)</label><input id="lfKap" type="number" min="0" value="${bearb&&l.kapazitaet!=null?l.kapazitaet:""}"></div>
      </div>
      <div class="feld"><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="lfAktiv" ${(!bearb || l.aktiv!==false)?"checked":""}> Aktiv (Häkchen entfernen = archiviert)</label></div>
      <div class="meta" style="margin-top:-4px">Vorschlag: 100 % = 25 Azubis. Kapazität wird aus dem Stellenumfang vorgeschlagen und ist überschreibbar.</div>
      <div class="modal-aktionen">
        <button onclick="Oberflaeche.modalZu()">Abbrechen</button>
        <button class="primaer" id="lfSpeichern">${bearb?"Speichern":"Anlegen"}</button>
      </div>`);
    const stelle=document.getElementById("lfStelle"), kap=document.getElementById("lfKap");
    if(bearb && l.kapazitaet!=null) kap.dataset.auto="0";   // vorhandene Kapazität nicht überschreiben
    const vorschlagen=()=>{ const v=Bezugslehrer.kapazitaetVorschlag(stelle.value);
      if(v!=null && (kap.value==="" || kap.dataset.auto==="1")){ kap.value=v; kap.dataset.auto="1"; } };
    kap.oninput=()=>{ kap.dataset.auto="0"; };     // manuell überschrieben -> Vorschlag nicht mehr aufzwingen
    stelle.oninput=vorschlagen;
    if(!bearb) vorschlagen();                        // nur bei "neu" initial vorschlagen (100 % -> 25)
    document.getElementById("lfSpeichern").onclick=async()=>{
      const name=document.getElementById("lfName").value.trim();
      if(!name){ this.toast("Name fehlt",true); return; }
      const st=stelle.value!==""?Number(stelle.value):null;
      const ka=kap.value!==""?Number(kap.value):null;
      const aktiv=document.getElementById("lfAktiv").checked;
      const okSave = bearb
        ? await Bezugslehrer.aendern(l.spId, {name, stellenumfang:st, kapazitaet:ka, aktiv})
        : await Bezugslehrer.anlegen(name, st, ka);
      if(okSave){ this.modalZu(); this.toast(bearb?"Bezugslehrer gespeichert":"Bezugslehrer angelegt"); this.render(); }
    };
  },
  /* Löschen mit Schutz: nur ohne zugeordnete Azubis. Sonst Hinweis -> erst neu zuordnen
     oder über "Bearbeiten" archivieren (Datenmodell-Entscheidung 24.07.2026). */
  async lehrerLoeschenKlick(spId){
    const l=Bezugslehrer.alle().find(x=>String(x.spId)===String(spId)); if(!l) return;
    const n=Bezugslehrer.azubiAnzahl(l);
    if(n>0){ this.toast(`„${bezugslehrerAnzeige(l.name)}" hat noch ${n} zugeordnete Azubi(s). Erst neu zuordnen – oder über „Bearbeiten" archivieren.`, true); return; }
    if(!confirm(`Bezugslehrer „${bezugslehrerAnzeige(l.name)}" wirklich löschen?`)) return;
    if(await Bezugslehrer.loeschen(spId)){ this.toast("Bezugslehrer gelöscht"); this.render(); }
  },
  /* v0.39: Archivieren/Reaktivieren direkt aus dem ⋮-Menü. Bisher steckte das nur
     als Häkchen im Bearbeiten-Dialog. Name/Stellenumfang/Kapazität werden bewusst
     NICHT mitgegeben -- seit v0.39 laesst aendern() ausgelassene Felder unberuehrt. */
  async lehrerArchivKlick(spId){
    const l=Bezugslehrer.alle().find(x=>String(x.spId)===String(spId)); if(!l) return;
    const neu=!(l.aktiv!==false);
    const nm=bezugslehrerAnzeige(l.name);
    if(!neu && Bezugslehrer.azubiAnzahl(l)>0
       && !confirm(`„${nm}" hat noch zugeordnete Azubis. Trotzdem archivieren?`)) return;
    if(await Bezugslehrer.aendern(spId, {aktiv:neu})){
      this.toast(neu?`„${nm}" ist wieder aktiv`:`„${nm}" archiviert`);
      this.render();
    }
  },

  /* ---- v0.41: Vertretung bei laengerer Abwesenheit -----------------------
     Beide Dialoge zeichnen sich bei jeder Auswahl neu (Muster von _dfaRendern):
     Der Zustand steckt in den Parametern, nicht in einem Instanzfeld -- so kann
     kein alter Dialogzustand einen neuen ueberleben. */
  _dlgEsc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); },

  lehrerAbwesendKlick(spId){
    const l=Bezugslehrer.alle().find(x=>String(x.spId)===String(spId)); if(!l) return;
    const zeilen=Dashboard.lehrkraftZeilen(Azubis.alle());
    const kandidaten=Dashboard.vertretungKandidaten(zeilen, Bezugslehrer.wertFuer(l));
    /* v0.41.1: Die Vertretung bleibt Pflicht (Christians Entscheidung) -- ohne
       Kandidaten laesst sich die Abwesenheit deshalb weiterhin nicht melden. */
    if(!kandidaten.length){
      this.toast("Es gibt niemanden, der vertreten könnte – alle anderen sind archiviert oder selbst abwesend.", true);
      return;
    }
    this._abwesendDialog(l, kandidaten, kandidaten[0].wert);
  },

  /* v0.41.1: Das Auswahlfeld bleibt, seine Bedeutung aendert sich. Die Vertretung
     wird VERMERKT (Ansprechpartner waehrend der Abwesenheit), bekommt die Azubis
     aber NICHT: die gehen nach "Ohne Zuordnung" und lassen sich von dort einzeln
     verteilen. Damit entfaellt die Kapazitaetsvorschau -- die Auslastung der
     Vertretung aendert sich durch die Abwesenheit nicht mehr. */
