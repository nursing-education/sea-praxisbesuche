# Führt die Logiktests automatisch bei GitHub aus – bei jedem Pull Request und
# nach jedem Merge auf main. Ergebnis erscheint als grüner Haken bzw. rotes Kreuz
# am Commit und im PR.
#
# Die Tests brauchen ausschliesslich Node-Builtins – deshalb kein "npm install",
# nur Node bereitstellen und den vorhandenen Runner starten. Er baut das Bundle
# aus index.html selbst. (Seit dem Biome-Setup gibt es zwar eine package.json,
# aber nur für Entwickler-Werkzeuge; die Tests hängen weiterhin an nichts davon.)
#
# Das Linting läuft deshalb als **eigener Job** daneben statt im selben: Es braucht
# npm, die Tests nicht. Beide laufen parallel, und ein fehlendes node_modules kann
# die Logiktests nicht ausbremsen.
#
# Grenze: geprüft wird nur die Logik. Ob das Dashboard im Browser gut aussieht
# und sich gut bedienen lässt, kann dieser Workflow nicht beantworten – die
# Browser-Abnahme bleibt Handarbeit. Auch der Linter ändert daran nichts: Er liest
# den Code, er führt ihn nicht aus.

name: Tests

on:
  pull_request:
  push:
    branches: [main]
    # Nur main: Bei Branches mit offenem PR würde sonst jeder Push doppelt laufen
    # (einmal für "push", einmal für "pull_request").

# Wird während eines laufenden Durchlaufs erneut gepusht, bricht der alte ab –
# spart Wartezeit und zeigt immer den Stand des letzten Commits.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logiktests:
    name: node tests/run-all.js
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Logiktests ausführen
        run: node tests/run-all.js

  linting:
    name: npm run lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Werkzeuge installieren
        run: npm ci

      - name: Linter ausführen
        run: npm run lint
